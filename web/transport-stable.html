<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Rutas 3D · Estable</title><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#07101b;color:#fff;font:14px system-ui}canvas{display:block}.hud,.controls{position:fixed;z-index:2;display:flex;gap:7px;flex-wrap:wrap}.hud{inset:10px 10px auto}.controls{left:10px;bottom:10px}.drive{left:auto;right:10px}.pill,button{padding:9px 12px;border:1px solid #36536c;border-radius:11px;background:#07101ddd;color:#fff}.pill b,button.on{color:#4ce6d0}button{font-weight:700}.release{position:fixed;z-index:3;right:10px;top:10px;padding:8px 11px;border:1px solid #39d98a;border-radius:10px;background:#07101ddd;color:#39d98a;font-weight:800}.mobile{display:none}@media(max-width:700px){.mobile{display:flex}.hud{font-size:11px;padding-top:42px}.pill,button{padding:8px}}</style></head><body><div class="release">ESTABLE · PRIMERA EDICIÓN</div><div class="hud"><div class="pill">Vehículo <b id="vn">Aster Viento 3D</b></div><div class="pill">Vista <b id="view">Exterior</b></div><div class="pill">Velocidad <b id="speed">0 km/h</b></div><div class="pill">Ciudad <b id="city">Nova Liria</b></div></div><div class="controls"><button id="truck" class="on">Camión</button><button id="bus">Autobús</button><button id="cam">Vista</button><button id="full">⛶</button></div><div class="controls drive"><button class="mobile" data-key="a">◀</button><button data-key="s">Freno</button><button data-key="w">Acelerar</button><button class="mobile" data-key="d">▶</button></div><script type="module">
import * as T from './vendor/three.module.min.js';const S=new T.Scene();S.background=new T.Color(0x87c8ed);S.fog=new T.Fog(0xa6d0e5,90,430);const C=new T.PerspectiveCamera(65,innerWidth/innerHeight,.1,900),R=new T.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,1.7));R.setSize(innerWidth,innerHeight);R.shadowMap.enabled=true;R.outputColorSpace=T.SRGBColorSpace;document.body.prepend(R.domElement);S.add(new T.HemisphereLight(0xe8f7ff,0x385329,2.2));const sun=new T.DirectionalLight(0xffedc4,3);sun.position.set(-70,110,-40);sun.castShadow=true;S.add(sun);const mat=(c,r=.65,m=.08)=>new T.MeshStandardMaterial({color:c,roughness:r,metalness:m}),box=(w,h,d,c)=>{const x=new T.Mesh(new T.BoxGeometry(w,h,d),mat(c));x.castShadow=x.receiveShadow=true;return x};let x=box(500,1,900,0x4d8943);x.position.y=-.6;S.add(x);x=box(30,.25,900,0x292e35);S.add(x);for(let z=-430;z<450;z+=18){x=box(.35,.05,8,0xf5df95);x.position.set(0,.17,z);S.add(x)}
for(let n=-5;n<=5;n++)for(const side of[-1,1])for(let i=0;i<6;i++){const h=12+((n*19+i*23+80)%43),b=box(9+i%3*3,h,11+i%2*4,[0x50667b,0xc28b58,0x6f8799,0x92676b][(i+n+8)%4]);b.position.set(side*(43+(i%2)*15),h/2,n*76+(i-3)*16);S.add(b);for(let y=4;y<h-2;y+=5){const w=box(.12,1.5,1.6,0xffdb7d);w.position.set(b.position.x-side*(b.geometry.parameters.width/2+.1),y,b.position.z);S.add(w)}}for(let z=-420;z<440;z+=30)for(const q of[-20,20]){const tr=box(.7,5,.7,0x70482a);tr.position.set(q,2.5,z);S.add(tr);const cr=new T.Mesh(new T.ConeGeometry(3.8,8,9),mat(0x21663c));cr.position.set(q,8,z);S.add(cr)}
let V,kind='truck',view=0,speed=0,steer=0,keys={};const tire=mat(0x111318,.9),glass=mat(0x173d52,.12,.55);function wheel(px,pz){const w=new T.Mesh(new T.CylinderGeometry(1.05,1.05,.65,20),tire);w.rotation.z=Math.PI/2;w.position.set(px,1,pz);return w}function interior(g,bus){let d=box(bus?4.7:3.7,.7,1.2,0x202833);d.position.set(0,2.25,-3.2);g.add(d);const st=new T.Mesh(new T.TorusGeometry(.55,.1,10,24),tire);st.position.set(-1.25,2.7,-3.75);st.rotation.x=Math.PI/2;g.add(st);for(let r=0;r<(bus?6:1);r++)for(const px of bus?[-1.45,1.45]:[-1.25]){const s=box(1.1,1.4,1.1,bus?0x285475:0x333944);s.position.set(px,1.5,r*2-1);g.add(s)}}function build(type){if(V)S.remove(V);kind=type;const g=new T.Group(),bus=type==='bus';if(bus){let b=box(5.3,4.2,14,0x2389b7);b.position.y=2.7;g.add(b);b=box(4.5,2.1,.15,0x173d52);b.position.set(0,3.5,-7.08);g.add(b);for(let r=-5;r<=5;r+=2.4)for(const p of[-2.66,2.66]){b=box(.12,1.6,1.6,0x245269);b.position.set(p,3.4,r);g.add(b)}for(const z of[-4.8,4.8])for(const p of[-2.5,2.5])g.add(wheel(p,z))}else{let b=box(5,4.2,5.5,0x19b7ad);b.position.set(0,2.8,-4.3);g.add(b);b=box(5.1,4.7,12,0xd4dbe0);b.position.set(0,3,4.6);g.add(b);b=box(4.2,1.7,.16,0x173d52);b.position.set(0,3.65,-7.08);g.add(b);for(const z of[-4.6,1.5,7.5])for(const p of[-2.45,2.45])g.add(wheel(p,z))}interior(g,bus);V=g;V.position.set(0,0,60);S.add(V);vn.textContent=bus?'Nortia Urbano X8':'Aster Viento 3D';truck.classList.toggle('on',!bus);document.querySelector('#bus').classList.toggle('on',bus)}
function camera(){const p=V.position;if(view===0){C.position.lerp(new T.Vector3(p.x+10,9,p.z+18),.12);C.lookAt(p.x,2,p.z-10)}else if(view===1){C.position.set(p.x-1.15,3.1,p.z-3.5);C.lookAt(p.x-1.1,2.8,p.z-35)}else{C.position.set(p.x,3.2,p.z+(kind==='bus'?4:5));C.lookAt(p.x,2.4,p.z-25)}}document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;b.onpointerdown=e=>{e.preventDefault();keys[k]=1};['pointerup','pointercancel','pointerleave'].forEach(v=>b.addEventListener(v,()=>keys[k]=0))});onkeydown=e=>keys[e.key.toLowerCase()]=1;onkeyup=e=>keys[e.key.toLowerCase()]=0;truck.onclick=()=>build('truck');document.querySelector('#bus').onclick=()=>build('bus');cam.onclick=()=>{view=(view+1)%3;document.querySelector('#view').textContent=['Exterior','Cabina','Interior trasero'][view]};full.onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();let last=performance.now();function loop(now){const dt=Math.min(.04,(now-last)/1000);last=now;speed+=((keys.w?34:0)-(keys.s?55:7))*dt;speed=T.MathUtils.clamp(speed,0,kind==='bus'?92:112);steer+=(keys.a?1:keys.d?-1:0)*dt*1.7;steer*=Math.pow(.28,dt);V.position.x=T.MathUtils.clamp(V.position.x+steer*speed*dt*.045,-10.5,10.5);V.position.z-=speed*dt*.17;if(V.position.z<-400)V.position.z=400;V.rotation.z=steer*.07;document.querySelector('#speed').textContent=Math.round(speed)+' km/h';document.querySelector('#city').textContent=['Nova Liria','Puerto Alba','Valleverde','Bahía Solar'][Math.max(0,Math.floor((420-V.position.z)/205)%4)];camera();R.render(S,C);requestAnimationFrame(loop)}build('truck');onresize=()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)};requestAnimationFrame(loop);
