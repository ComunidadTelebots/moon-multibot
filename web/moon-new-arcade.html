<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Misiones Moon</title><style>:root{color-scheme:dark;--p:#0c2029;--l:#24505a;--c:#58ead7}*{box-sizing:border-box}body{margin:0;padding:12px;background:#061019;color:#eefcff;font:14px system-ui}.brand{font-size:10px;letter-spacing:.15em;color:var(--c);font-weight:900}header{display:flex;justify-content:space-between;align-items:end}h1{margin:4px 0}.modes,.controls{display:flex;gap:7px;margin:10px 0;overflow:auto}button{border:1px solid var(--l);border-radius:11px;padding:11px;background:var(--p);color:#eefcff;font-weight:750;white-space:nowrap}.on{border-color:var(--c);color:var(--c)}canvas{display:block;width:100%;max-width:760px;aspect-ratio:16/10;margin:auto;border:1px solid var(--l);border-radius:16px;touch-action:none}.controls{justify-content:center}.controls button{min-width:70px}.msg{text-align:center;color:#91aeb5}</style></head><body><header><div><div class="brand">TODOSOBREALLTECH STUDIOS</div><h1 id="title">Brigada Forestal</h1></div><b>Puntos <span id="score">0</span></b></header><nav class="modes"><button class="on" data-mode="fire">🔥 Brigada Forestal</button><button data-mode="drone">📦 Dron Mensajero</button><button data-mode="sub">🌊 Abismo Azul</button></nav><canvas id="game" width="960" height="600"></canvas><div class="controls"><button data-move="-1">←</button><button id="action">Iniciar</button><button data-move="1">→</button></div><p class="msg" id="message">Apaga los focos antes de que alcancen el bosque.</p><script>
const c=game,x=c.getContext('2d'),info={fire:['Brigada Forestal','Apaga los focos antes de que alcancen el bosque.'],drone:['Dron Mensajero','Recoge paquetes y evita antenas.'],sub:['Abismo Azul','Recupera muestras y esquiva rocas.']};let mode='fire',run=0,points=0,lane=1,items=[],last=0,next=0,raf;
function reset(){run=0;points=0;lane=1;items=[];score.textContent=0;action.textContent='Iniciar';draw(0)}function move(d){lane=Math.max(0,Math.min(2,lane+d))}function start(){run=!run;action.textContent=run?'Pausa':'Continuar';if(run){last=performance.now();raf=requestAnimationFrame(loop)}else cancelAnimationFrame(raf)}
function draw(t){let g=x.createLinearGradient(0,0,0,600),cs=mode==='fire'?['#48243c','#ca5f32']:mode==='drone'?['#55b6df','#d8eff5']:['#07365e','#020b1d'];g.addColorStop(0,cs[0]);g.addColorStop(1,cs[1]);x.fillStyle=g;x.fillRect(0,0,960,600);x.globalAlpha=.22;x.fillStyle=mode==='sub'?'#75d9d0':'#152b32';for(let i=0;i<20;i++){x.beginPath();x.arc((i*137+t*.012)%1050-50,60+(i*79)%470,mode==='sub'?4:24,0,7);x.fill()}x.globalAlpha=1;for(const o of items){let px=300+o.lane*180;x.fillStyle=o.good?'#58ead7':mode==='fire'?'#ff632b':'#26343a';x.beginPath();o.good?x.arc(px,o.y,22,0,7):(x.moveTo(px,o.y-28),x.lineTo(px+30,o.y+27),x.lineTo(px-30,o.y+27),x.closePath());x.fill()}let px=300+lane*180;x.fillStyle='#07191f';x.strokeStyle='#58ead7';x.lineWidth=4;if(mode==='sub'){x.beginPath();x.ellipse(px,500,40,23,0,0,7);x.fill();x.stroke()}else{x.fillRect(px-32,478,64,44);x.strokeRect(px-32,478,64,44);if(mode==='drone')for(const q of[-43,43]){x.beginPath();x.arc(px+q,480,14,0,7);x.stroke()}}}
function over(){run=0;action.textContent='Reintentar';message.textContent=`Misión terminada · ${Math.floor(points)} puntos`}function loop(now){let dt=Math.min(.035,(now-last)/1000);last=now;next-=dt;if(next<=0){items.push({lane:Math.floor(Math.random()*3),y:-50,good:Math.random()<.35});next=.65+Math.random()*.45}for(const o of items)o.y+=190*dt;for(const o of items)if(!o.hit&&o.lane===lane&&Math.abs(o.y-500)<48){o.hit=1;if(o.good)points+=10;else return over()}items=items.filter(o=>o.y<650&&!o.hit);points+=dt*2;score.textContent=Math.floor(points);draw(now);raf=requestAnimationFrame(loop)}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{document.querySelector('.modes .on').classList.remove('on');b.classList.add('on');mode=b.dataset.mode;title.textContent=info[mode][0];message.textContent=info[mode][1];reset()});document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>move(+b.dataset.move));action.onclick=start;addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')move(-1);if(e.key==='ArrowRight'||e.key==='d')move(1);if(e.key===' ')start()});reset();
</script></body></html>
