<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Operaciones Moon</title><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#07101b;color:#fff;font:14px system-ui}canvas{width:100vw;height:100vh;display:block;touch-action:none}.hud,.pad{position:fixed;display:flex;gap:7px;flex-wrap:wrap}.hud{inset:10px 10px auto}.pad{inset:auto 10px 10px;justify-content:center}.pill,button{padding:9px 12px;border:1px solid #3c5b70;border-radius:11px;background:#07101ddd;color:#fff}.pill b,button.on{color:#4ce6d0}button{font-weight:800;min-width:64px}@media(max-width:600px){.hud{font-size:11px}.pad{justify-content:space-between}button{padding:13px 10px}}</style></head><body><canvas id="game"></canvas><div class="hud"><span class="pill">Misión <b id="title"></b></span><span class="pill">Puntos <b id="score">0</b></span><span class="pill">Vidas <b id="lives">3</b></span><span class="pill">Nivel <b id="level">1</b></span><span class="pill">Estado <b id="state">Pulsa iniciar</b></span></div><div class="pad"><button data-key="left">◀</button><button data-key="up">▲</button><button data-key="down">▼</button><button data-key="right">▶</button><button id="action">Acción</button><button id="start" class="on">Iniciar</button></div><script>
const mode=new URLSearchParams(location.search).get('mode')||'rail',cfg={rail:{name:'Enlace Ferroviario',bg:'#172533',player:'#f1b441',good:'#55e2c6',bad:'#e45e65',action:'Cambiar vía'},air:{name:'Control Aéreo',bg:'#15314b',player:'#ecf6ff',good:'#5ce0bd',bad:'#ff8860',action:'Autorizar pista'},sea:{name:'Rescate Marítimo',bg:'#08324a',player:'#ffcc43',good:'#6cffe0',bad:'#d85b62',action:'Rescatar'}}[mode],c=game,x=c.getContext('2d'),keys={},p={x:150,y:300,vx:0,vy:0,bank:0},objects=[],particles=[];let run=false,points=0,hp=3,frame=0,route=0;title.textContent=cfg.name;action.textContent=cfg.action;
function resize(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);p.x=Math.min(p.x,innerWidth-30);p.y=Math.min(p.y,innerHeight-70);draw()}onresize=resize;function reset(){points=frame=0;hp=3;route=0;objects.length=particles.length=0;p.x=innerWidth/2;p.y=innerHeight*.72;p.vx=p.vy=0;score.textContent=0;lives.textContent=3;level.textContent=1;state.textContent='Operación en curso';run=true;requestAnimationFrame(loop)}function spawn(){objects.push({x:25+Math.random()*(innerWidth-50),y:-30,good:Math.random()<.38,speed:1.7+points/180+Math.random()*1.5,phase:Math.random()*7})}function vehicle(){x.save();x.translate(p.x+7,p.y+9);x.rotate(p.bank);x.fillStyle='#0008';x.beginPath();x.ellipse(0,6,mode==='air'?31:27,17,0,0,7);x.fill();x.translate(-7,-9);x.fillStyle=cfg.player;if(mode==='rail'){x.fillRect(-18,-30,36,60);x.fillStyle='#18242c';x.fillRect(-13,-22,26,16);x.fillStyle='#e9f4d0';x.fillRect(-12,-31,7,4);x.fillRect(5,-31,7,4)}else if(mode==='air'){x.beginPath();x.moveTo(0,-31);x.lineTo(-28,24);x.lineTo(-6,15);x.lineTo(0,25);x.lineTo(6,15);x.lineTo(28,24);x.fill();x.fillStyle='#2680aa';x.fillRect(-5,-17,10,25)}else{x.beginPath();x.moveTo(-28,18);x.lineTo(28,18);x.lineTo(17,-16);x.lineTo(-17,-16);x.fill();x.fillStyle='#142b36';x.fillRect(-13,-11,26,16);x.fillStyle='#fff';x.fillRect(-4,-25,8,14)}x.restore()}function draw(){const g=x.createLinearGradient(0,0,0,innerHeight);g.addColorStop(0,cfg.bg);g.addColorStop(1,mode==='sea'?'#031d2c':'#080d12');x.fillStyle=g;x.fillRect(0,0,innerWidth,innerHeight);if(mode==='rail'){x.fillStyle='#273027';x.fillRect(0,0,innerWidth,innerHeight);x.fillStyle='#3d4545';x.fillRect(innerWidth/2-80,0,160,innerHeight);x.strokeStyle='#c1c9c8';x.lineWidth=5;for(const q of [-55,55]){x.beginPath();x.moveTo(innerWidth/2+q,0);x.lineTo(innerWidth/2+q+route*80,innerHeight);x.stroke()}x.strokeStyle='#67523d';x.lineWidth=7;for(let y=(frame*3)%26-26;y<innerHeight;y+=26){x.beginPath();x.moveTo(innerWidth/2-67,y);x.lineTo(innerWidth/2+67,y);x.stroke()}}else if(mode==='air'){x.fillStyle='#263039';x.fillRect(innerWidth/2-72,0,144,innerHeight);x.strokeStyle='#f5f1ce';x.lineWidth=4;x.setLineDash([28,24]);x.beginPath();x.moveTo(innerWidth/2,0);x.lineTo(innerWidth/2,innerHeight);x.stroke();x.setLineDash([]);for(let i=0;i<10;i++){x.fillStyle='#ffffff18';x.beginPath();x.arc((i*137+frame*.18)%innerWidth,70+(i*83)%Math.max(100,innerHeight-130),25+i%3*12,0,7);x.fill()}}else{for(let y=(frame*1.4)%45-45;y<innerHeight;y+=45){x.strokeStyle='#1680a6';x.lineWidth=2;x.beginPath();x.moveTo(0,y);x.quadraticCurveTo(innerWidth/2,y+18,innerWidth,y);x.stroke()}}for(const o of objects){x.save();x.shadowColor=o.good?cfg.good:cfg.bad;x.shadowBlur=12;x.fillStyle=o.good?cfg.good:cfg.bad;x.beginPath();if(mode==='air'){x.moveTo(o.x,o.y-14);x.lineTo(o.x-18,o.y+12);x.lineTo(o.x+18,o.y+12)}else x.arc(o.x,o.y,mode==='sea'?13:11,0,7);x.fill();x.restore()}for(const q of particles){x.globalAlpha=q.life;x.fillStyle=q.c;x.fillRect(q.x,q.y,q.s,q.s)}x.globalAlpha=1;vehicle()}
function burst(px,py,color){for(let i=0;i<12;i++)particles.push({x:px,y:py,vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*4,life:1,s:2+Math.random()*3,c:color})}function act(){if(!run)return;if(mode==='rail'){route=route?0:(p.x<innerWidth/2?-1:1);state.textContent='Cambio de vía preparado'}else{const o=objects.find(v=>v.good&&Math.hypot(v.x-p.x,v.y-p.y)<65);if(o){burst(o.x,o.y,cfg.good);o.y=innerHeight+100;points+=20;score.textContent=points;state.textContent=mode==='air'?'Aterrizaje autorizado':'Persona rescatada'}else state.textContent='No hay objetivo próximo'}}function loop(){if(!run){draw();return}frame++;if(frame%Math.max(28,65-Math.floor(points/25))===0)spawn();const mx=(keys.right?1:0)-(keys.left?1:0),my=(keys.down?1:0)-(keys.up?1:0),accel=mode==='air'?.17:mode==='sea'?.13:.2,drag=mode==='sea'?.94:.91;p.vx=(p.vx+mx*accel)*drag;p.vy=(p.vy+my*accel)*drag;p.bank+=(p.vx*.12-p.bank)*.08;p.x=Math.max(25,Math.min(innerWidth-25,p.x+p.vx));p.y=Math.max(70,Math.min(innerHeight-55,p.y+p.vy));if(mode==='sea'&&Math.hypot(p.vx,p.vy)>.3&&frame%3===0)particles.push({x:p.x+(Math.random()-.5)*22,y:p.y+20,vx:-p.vx*.2,vy:1+Math.random(),life:.8,s:2+Math.random()*3,c:'#bcefff'});for(const q of particles){q.x+=q.vx;q.y+=q.vy;q.life-=.025}particles.splice(0,particles.length,...particles.filter(q=>q.life>0));for(const o of objects){o.y+=o.speed;o.x+=Math.sin(frame*.025+o.phase)*(mode==='air'?1.1:.35);if(!o.good&&Math.hypot(o.x-p.x,o.y-p.y)<28){burst(o.x,o.y,cfg.bad);o.y=innerHeight+100;hp--;lives.textContent=hp;if(!hp){run=false;state.textContent='Misión terminada · '+points+' puntos'}}else if(mode==='rail'&&o.good&&o.y>p.y-30&&o.y<p.y+35&&Math.abs(o.x-p.x)<28){burst(o.x,o.y,cfg.good);o.y=innerHeight+100;points+=10;score.textContent=points}}objects.splice(0,objects.length,...objects.filter(o=>o.y<innerHeight+40));level.textContent=1+Math.floor(points/100);draw();requestAnimationFrame(loop)}
for(const b of document.querySelectorAll('[data-key]')){const k=b.dataset.key;b.onpointerdown=()=>keys[k]=1;b.onpointerup=b.onpointercancel=()=>keys[k]=0}onkeydown=e=>{const k={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'up',w:'up',ArrowDown:'down',s:'down'}[e.key];if(k)keys[k]=1;if(e.key===' ')act()};onkeyup=e=>{const k={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'up',w:'up',ArrowDown:'down',s:'down'}[e.key];if(k)keys[k]=0};action.onclick=act;start.onclick=reset;resize();
</script></body></html>
