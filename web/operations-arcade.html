<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Operaciones Moon</title><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#07101b;color:#fff;font:14px system-ui}canvas{width:100vw;height:100vh;display:block;touch-action:none}.hud,.pad{position:fixed;display:flex;gap:7px;flex-wrap:wrap}.hud{inset:10px 10px auto}.pad{inset:auto 10px 10px;justify-content:center}.pill,button{padding:9px 12px;border:1px solid #3c5b70;border-radius:11px;background:#07101ddd;color:#fff}.pill b,button.on{color:#4ce6d0}button{font-weight:800;min-width:64px}@media(max-width:600px){.hud{font-size:11px}.pad{justify-content:space-between}button{padding:13px 10px}}</style></head><body><canvas id="game"></canvas><div class="hud"><span class="pill">Misión <b id="title"></b></span><span class="pill">Puntos <b id="score">0</b></span><span class="pill">Vidas <b id="lives">3</b></span><span class="pill">Nivel <b id="level">1</b></span><span class="pill">Estado <b id="state">Pulsa iniciar</b></span></div><div class="pad"><button data-key="left">◀</button><button data-key="up">▲</button><button data-key="down">▼</button><button data-key="right">▶</button><button id="action">Acción</button><button id="start" class="on">Iniciar</button></div><script>
const mode=new URLSearchParams(location.search).get('mode')||'rail',cfg={rail:{name:'Enlace Ferroviario',bg:'#172533',player:'#f1b441',good:'#55e2c6',bad:'#e45e65',action:'Cambiar vía'},air:{name:'Control Aéreo',bg:'#15314b',player:'#ecf6ff',good:'#5ce0bd',bad:'#ff8860',action:'Autorizar pista'},sea:{name:'Rescate Marítimo',bg:'#08324a',player:'#ffcc43',good:'#6cffe0',bad:'#d85b62',action:'Rescatar'}}[mode],c=game,x=c.getContext('2d'),keys={},p={x:150,y:300},objects=[];let run=false,points=0,hp=3,frame=0,route=0;title.textContent=cfg.name;action.textContent=cfg.action;
function resize(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);p.x=Math.min(p.x,innerWidth-30);p.y=Math.min(p.y,innerHeight-70);draw()}onresize=resize;function reset(){points=frame=0;hp=3;route=0;objects.length=0;p.x=innerWidth/2;p.y=innerHeight*.72;score.textContent=0;lives.textContent=3;level.textContent=1;state.textContent='Operación en curso';run=true;requestAnimationFrame(loop)}function spawn(){objects.push({x:25+Math.random()*(innerWidth-50),y:-30,good:Math.random()<.38,speed:1.7+points/180+Math.random()*1.5,phase:Math.random()*7})}function draw(){x.fillStyle=cfg.bg;x.fillRect(0,0,innerWidth,innerHeight);if(mode==='rail'){x.strokeStyle='#9ca9ad';x.lineWidth=4;for(const q of [-55,55]){x.beginPath();x.moveTo(innerWidth/2+q,0);x.lineTo(innerWidth/2+q+route*80,innerHeight);x.stroke()}x.setLineDash([8,12]);x.strokeStyle='#4a5960';for(let y=0;y<innerHeight;y+=24){x.beginPath();x.moveTo(innerWidth/2-65,y);x.lineTo(innerWidth/2+65,y);x.stroke()}x.setLineDash([])}else if(mode==='air'){x.strokeStyle='#bcd8e8';x.setLineDash([18,18]);x.beginPath();x.moveTo(innerWidth/2,0);x.lineTo(innerWidth/2,innerHeight);x.stroke();x.setLineDash([])}else{for(let y=20;y<innerHeight;y+=45){x.strokeStyle='#167094';x.beginPath();x.moveTo(0,y);x.quadraticCurveTo(innerWidth/2,y+15,innerWidth,y);x.stroke()}}for(const o of objects){x.fillStyle=o.good?cfg.good:cfg.bad;x.beginPath();if(mode==='air'){x.moveTo(o.x,o.y-14);x.lineTo(o.x-18,o.y+12);x.lineTo(o.x+18,o.y+12)}else x.arc(o.x,o.y,mode==='sea'?13:11,0,7);x.fill()}x.save();x.translate(p.x,p.y);x.fillStyle=cfg.player;if(mode==='rail')x.fillRect(-18,-30,36,60);else if(mode==='air'){x.beginPath();x.moveTo(0,-28);x.lineTo(-24,24);x.lineTo(0,14);x.lineTo(24,24);x.fill()}else{x.beginPath();x.moveTo(-25,18);x.lineTo(25,18);x.lineTo(16,-14);x.lineTo(-16,-14);x.fill()}x.restore()}
function act(){if(!run)return;if(mode==='rail'){route=route?0:(p.x<innerWidth/2?-1:1);state.textContent='Cambio de vía preparado'}else{const o=objects.find(v=>v.good&&Math.hypot(v.x-p.x,v.y-p.y)<65);if(o){o.y=innerHeight+100;points+=20;score.textContent=points;state.textContent=mode==='air'?'Aterrizaje autorizado':'Persona rescatada'}else state.textContent='No hay objetivo próximo'}}function loop(){if(!run){draw();return}frame++;if(frame%Math.max(28,65-Math.floor(points/25))===0)spawn();const s=3.2+(keys.up?1.3:0),mx=(keys.right?1:0)-(keys.left?1:0),my=(keys.down?1:0)-(keys.up?1:0);p.x=Math.max(25,Math.min(innerWidth-25,p.x+mx*s));p.y=Math.max(70,Math.min(innerHeight-55,p.y+my*s));for(const o of objects){o.y+=o.speed;o.x+=Math.sin(frame*.025+o.phase)*(mode==='air'?1.1:.35);if(!o.good&&Math.hypot(o.x-p.x,o.y-p.y)<28){o.y=innerHeight+100;hp--;lives.textContent=hp;if(!hp){run=false;state.textContent='Misión terminada · '+points+' puntos'}}else if(mode==='rail'&&o.good&&o.y>p.y-30&&o.y<p.y+35&&Math.abs(o.x-p.x)<28){o.y=innerHeight+100;points+=10;score.textContent=points}}objects.splice(0,objects.length,...objects.filter(o=>o.y<innerHeight+40));level.textContent=1+Math.floor(points/100);draw();requestAnimationFrame(loop)}
for(const b of document.querySelectorAll('[data-key]')){const k=b.dataset.key;b.onpointerdown=()=>keys[k]=1;b.onpointerup=b.onpointercancel=()=>keys[k]=0}onkeydown=e=>{const k={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'up',w:'up',ArrowDown:'down',s:'down'}[e.key];if(k)keys[k]=1;if(e.key===' ')act()};onkeyup=e=>{const k={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'up',w:'up',ArrowDown:'down',s:'down'}[e.key];if(k)keys[k]=0};action.onclick=act;start.onclick=reset;resize();
</script></body></html>
