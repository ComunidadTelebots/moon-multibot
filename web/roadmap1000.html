<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Horizonte unificado</title><style>body{margin:0;background:#070b14;color:#e8eefc;font:14px system-ui}main{max-width:1100px;margin:auto;padding:24px}a{color:#67e8f9}h1{font-size:32px}.muted{color:#94a3b8}.summary,.filters{display:grid;gap:10px}.summary{grid-template-columns:repeat(4,1fr);margin:20px 0}.metric,.card{border:1px solid #263244;background:#0f172a;border-radius:14px;padding:16px}.metric b{font-size:24px}.filters{grid-template-columns:2fr repeat(3,1fr);position:sticky;top:0;background:#070b14;padding:12px 0}input,select{background:#111827;color:#fff;border:1px solid #334155;border-radius:10px;padding:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.tag{display:inline-block;background:#164e63;color:#cffafe;border-radius:999px;padding:4px 8px;margin:0 5px 8px 0;font-size:11px}.ready{color:#6ee7b7}.pending{color:#fbbf24}button{background:#0e7490;color:#fff;border:0;border-radius:9px;padding:10px 14px;margin:16px 5px 0 0}@media(max-width:650px){.filters,.summary{grid-template-columns:1fr 1fr}}</style></head><body><main><a href="/hub.html">← Volver a Moonbot</a><header><h1>Horizonte unificado</h1><p class="muted">100 funciones ejecutables y 1.000 iniciativas para TodoSobreAllTech, Moonbot y Telegram WebApp.</p></header><div class="summary"><div class="metric"><b>1.100</b><div class="muted">Total</div></div><div class="metric"><b>100</b><div class="muted">Núcleo ejecutable</div></div><div class="metric"><b id="implemented">0</b><div class="muted">Roadmap implementado</div></div><div class="metric"><b id="pending">0</b><div class="muted">Pendientes</div></div></div><div class="filters"><input id="q" placeholder="Buscar en el horizonte"><select id="product"><option value="all">Todos los productos</option><option value="web">TodoSobreAllTech</option><option value="moonbot">Moonbot</option><option value="webapp">Telegram WebApp</option></select><select id="category"><option value="all">Todas las categorías</option></select><select id="status"><option value="all">Todos los estados</option><option value="implemented">Implementadas</option><option value="proposed">Propuestas</option></select></div><p id="count" class="muted"></p><div id="grid" class="grid"></div><button id="prev">Anterior</button><button id="next">Siguiente</button><span id="page" class="muted"></span></main><script>let data=[],page=1;const size=60,q=document.querySelector('#q'),product=document.querySelector('#product'),category=document.querySelector('#category'),status=document.querySelector('#status'),grid=document.querySelector('#grid'),count=document.querySelector('#count'),prev=document.querySelector('#prev'),next=document.querySelector('#next'),pageLabel=document.querySelector('#page');fetch('/future-features-1000.json').then(r=>r.json()).then(c=>{data=c.items||[];document.querySelector('#implemented').textContent=c.implemented||0;document.querySelector('#pending').textContent=(c.total||0)-(c.implemented||0);[...new Set(data.map(x=>x.category))].sort().forEach(x=>category.add(new Option(x,x)));render()});function render(){const text=q.value.toLowerCase(),rows=data.filter(x=>(product.value==='all'||x.product===product.value)&&(category.value==='all'||x.category===category.value)&&(status.value==='all'||x.status===status.value)&&(!text||(x.title+' '+x.description).toLowerCase().includes(text)));const pages=Math.max(1,Math.ceil(rows.length/size));page=Math.min(page,pages);grid.innerHTML=rows.slice((page-1)*size,page*size).map(x=>`<article class="card"><span class="tag">${x.product_name}</span><span class="tag">${x.category}</span><h3>${x.title}</h3><p class="muted">${x.description}</p><p>Dificultad: ${x.difficulty} · Prioridad: ${x.priority}</p><p class="${x.status==='implemented'?'ready':'pending'}">${x.status==='implemented'?'Implementada':'Propuesta · pendiente'}</p></article>`).join('');count.textContent=`${rows.length} resultados del roadmap; las 100 funciones ejecutables están en el panel anterior.`;pageLabel.textContent=` Página ${page} de ${pages}`;prev.disabled=page<=1;next.disabled=page>=pages}q.oninput=product.onchange=category.onchange=status.onchange=()=>{page=1;render()};prev.onclick=()=>{page--;render()};next.onclick=()=>{page++;render()};</script></body></html>
