<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Horizonte 1000</title><style>body{margin:0;background:#070b14;color:#e8eefc;font:14px system-ui}main{max-width:1100px;margin:auto;padding:24px}a{color:#67e8f9}h1{font-size:32px}header p,.muted{color:#94a3b8}.filters{display:grid;grid-template-columns:2fr repeat(2,1fr);gap:10px;position:sticky;top:0;background:#070b14;padding:12px 0}input,select{background:#111827;color:#fff;border:1px solid #334155;border-radius:10px;padding:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.card{border:1px solid #263244;background:#0f172a;border-radius:14px;padding:16px}.tag{display:inline-block;background:#164e63;color:#cffafe;border-radius:999px;padding:4px 8px;margin:0 5px 8px 0;font-size:11px}.status{color:#fbbf24;font-size:12px}button{background:#0e7490;color:white;border:0;border-radius:9px;padding:10px 14px;margin:16px 5px 0 0}@media(max-width:650px){.filters{grid-template-columns:1fr}}</style></head><body><main><a href="/hub.html">â† Volver a Moonbot</a><header><h1>Horizonte 1000</h1><p>1.000 propuestas nuevas: 334 para TodoSobreAllTech, 333 para Moonbot y 333 para Telegram WebApp.</p></header><div class="filters"><input id="q" placeholder="Buscar propuestas"><select id="product"><option value="all">Todos los productos</option><option value="web">TodoSobreAllTech</option><option value="moonbot">Moonbot</option><option value="webapp">Telegram WebApp</option></select><select id="category"><option value="all">Todas las categorÃ­as</option></select></div><p id="count" class="muted"></p><div id="grid" class="grid"></div><button id="prev">Anterior</button><button id="next">Siguiente</button><span id="page" class="muted"></span></main><script>let data=[],page=1;const size=60,q=document.querySelector('#q'),product=document.querySelector('#product'),category=document.querySelector('#category'),grid=document.querySelector('#grid'),count=document.querySelector('#count'),prev=document.querySelector('#prev'),next=document.querySelector('#next'),pageLabel=document.querySelector('#page');fetch('/future-features-1000.json').then(r=>r.json()).then(c=>{data=c.items;[...new Set(data.map(x=>x.category))].sort().forEach(x=>category.add(new Option(x,x)));render()});function render(){const text=q.value.toLowerCase(),rows=data.filter(x=>(product.value==='all'||x.product===product.value)&&(category.value==='all'||x.category===category.value)&&(!text||(x.title+' '+x.description).toLowerCase().includes(text)));const pages=Math.max(1,Math.ceil(rows.length/size));page=Math.min(page,pages);grid.innerHTML=rows.slice((page-1)*size,page*size).map(x=>`<article class="card"><span class="tag">${x.product_name}</span><span class="tag">${x.category}</span><h3>${x.title}</h3><p class="muted">${x.description}</p><p>Dificultad: ${x.difficulty} Â· Prioridad: ${x.priority}</p><p class="status">Propuesta Â· pendiente de priorizaciÃ³n</p></article>`).join('');count.textContent=`${rows.length} resultados`;pageLabel.textContent=` PÃ¡gina ${page} de ${pages}`;prev.disabled=page<=1;next.disabled=page>=pages}q.oninput=product.onchange=category.onchange=()=>{page=1;render()};prev.onclick=()=>{page--;render()};next.onclick=()=>{page++;render()}</script></body></html>
