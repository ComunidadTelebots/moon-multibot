<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Rutas 3D</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        overflow: hidden;
        background: #07101b;
        color: #fff;
        font: 14px system-ui;
      }
      canvas {
        display: block;
      }
      .hud,
      .controls {
        position: fixed;
        z-index: 2;
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
      }
      .hud {
        inset: 10px 10px auto;
      }
      .controls {
        left: 10px;
        bottom: 10px;
      }
      .drive {
        left: auto;
        right: 10px;
      }
      .pill,
      button {
        padding: 9px 12px;
        border: 1px solid #36536c;
        border-radius: 11px;
        background: #07101ddd;
        color: #fff;
      }
      .pill b,
      button.on {
        color: #4ce6d0;
      }
      button {
        font-weight: 700;
      }
      .mobile {
        display: none;
      }
      @media (max-width: 700px) {
        .mobile {
          display: flex;
        }
        .hud {
          font-size: 11px;
        }
        .pill,
        button {
          padding: 8px;
        }
      }
    </style>
  </head>
  <body>
    <div class="hud">
      <div class="pill">Vehículo <b id="vn">Aster Viento 3D</b></div>
      <div class="pill">Vista <b id="view">Exterior</b></div>
      <div class="pill">Velocidad <b id="speed">0 km/h</b></div>
      <div class="pill">Ciudad <b id="city">Nova Liria</b></div>
    </div>
    <div class="controls">
      <button id="truck" class="on">Camión</button
      ><button id="bus">Autobús</button><button id="cam">Vista</button
      ><button id="full">⛶</button>
    </div>
    <div class="controls drive">
      <button class="mobile" data-key="a">◀</button
      ><button data-key="s">Freno</button><button data-key="w">Acelerar</button
      ><button class="mobile" data-key="d">▶</button>
    </div>
    <script type="module">
      import * as T from "./vendor/three.module.min.js";
      const graphicsParams = new URLSearchParams(location.search),
        graphicsMode = graphicsParams.get("graphics") || "auto",
        graphicsQuality = graphicsParams.get("quality") || "high",
        qualityLevel = { low: 0, medium: 1, high: 2, ultra: 3 }[graphicsQuality] ?? 2,
        pixelRatio = [0.75, 1.15, 1.75, 2.4][qualityLevel],
        shadows = graphicsMode !== "compat" && qualityLevel > 0;
      const S = new T.Scene();
      S.background = new T.Color(0x87c8ed);
      S.fog = new T.Fog(0xa6d0e5, 90, 430);
      const C = new T.PerspectiveCamera(65, innerWidth / innerHeight, 0.1, 900),
        R = new T.WebGLRenderer({ antialias: qualityLevel > 0, powerPreference: graphicsMode === "gpu" ? "high-performance" : "default" });
      R.setPixelRatio(Math.min(devicePixelRatio, pixelRatio));
      R.setSize(innerWidth, innerHeight);
      R.shadowMap.enabled = shadows;
      R.shadowMap.type = T.PCFSoftShadowMap;
      R.outputColorSpace = T.SRGBColorSpace;
      R.toneMapping = T.ACESFilmicToneMapping;
      R.toneMappingExposure = qualityLevel >= 2 ? 1.15 : 1;
      document.body.prepend(R.domElement);
      S.add(new T.HemisphereLight(0xe8f7ff, 0x385329, 2.2));
      const sun = new T.DirectionalLight(0xffedc4, 3);
      sun.position.set(-70, 110, -40);
      sun.castShadow = shadows;
      sun.shadow.mapSize.set(qualityLevel === 3 ? 4096 : qualityLevel === 2 ? 2048 : 1024, qualityLevel === 3 ? 4096 : qualityLevel === 2 ? 2048 : 1024);
      S.add(sun);
      document.querySelector(".hud").insertAdjacentHTML("beforeend", `<div class="pill">Gráficos <b>${graphicsQuality.toUpperCase()} · ${shadows ? "GPU" : "2D"}</b></div>`);
      const mat = (c, r = 0.65, m = 0.08) =>
          new T.MeshStandardMaterial({ color: c, roughness: r, metalness: m }),
        box = (w, h, d, c) => {
          const x = new T.Mesh(new T.BoxGeometry(w, h, d), mat(c));
          x.castShadow = x.receiveShadow = true;
          return x;
        };
      let x = box(500, 1, 900, 0x4d8943);
      x.position.y = -0.6;
      S.add(x);
      x = box(30, 0.25, 900, 0x292e35);
      S.add(x);
      for (let z = -430; z < 450; z += 18) {
        x = box(0.35, 0.05, 8, 0xf5df95);
        x.position.set(0, 0.17, z);
        S.add(x);
      }
      const cityRadius = [3, 5, 7, 9][qualityLevel], cityRows = [3, 4, 6, 8][qualityLevel];
      for (let n = -cityRadius; n <= cityRadius; n++)
        for (const side of [-1, 1])
          for (let i = 0; i < cityRows; i++) {
            const h = 12 + ((n * 19 + i * 23 + 80) % 43),
              b = box(
                9 + (i % 3) * 3,
                h,
                11 + (i % 2) * 4,
                [0x50667b, 0xc28b58, 0x6f8799, 0x92676b][(i + n + 8) % 4],
              );
            b.position.set(
              side * (43 + (i % 2) * 15),
              h / 2,
              n * 76 + (i - 3) * 16,
            );
            S.add(b);
            for (let y = 4; y < h - 2; y += 5) {
              const w = box(0.12, 1.5, 1.6, 0xffdb7d);
              w.position.set(
                b.position.x - side * (b.geometry.parameters.width / 2 + 0.1),
                y,
                b.position.z,
              );
              S.add(w);
            }
          }
      for (let z = -420; z < 440; z += 30)
        for (const q of [-20, 20]) {
          const tr = box(0.7, 5, 0.7, 0x70482a);
          tr.position.set(q, 2.5, z);
          S.add(tr);
          const cr = new T.Mesh(new T.ConeGeometry(3.8, 8, 9), mat(0x21663c));
          cr.position.set(q, 8, z);
          S.add(cr);
        }
      let V,
        kind = "truck",
        view = 0,
        speed = 0,
        steer = 0,
        keys = {};
      const tire = mat(0x090b0e, 0.92),
        glass = new T.MeshPhysicalMaterial({
          color: 0x17445d,
          roughness: 0.08,
          metalness: 0.15,
          transparent: true,
          opacity: 0.76,
          transmission: 0.18,
        }),
        chrome = mat(0xb8c3c9, 0.18, 0.88),
        lamp = mat(0xfff0b0, 0.12, 0.25),
        red = mat(0xe51c3a, 0.2, 0.2);
      function wheel(px, pz) {
        const w = new T.Group(),
          t = new T.Mesh(new T.CylinderGeometry(1.05, 1.05, 0.7, 28), tire),
          hub = new T.Mesh(new T.CylinderGeometry(0.5, 0.5, 0.73, 20), chrome);
        t.rotation.z = hub.rotation.z = Math.PI / 2;
        w.add(t, hub);
        w.position.set(px, 1, pz);
        return w;
      }
      function part(g, w, h, d, c, px, py, pz) {
        const b = box(w, h, d, c);
        b.position.set(px, py, pz);
        g.add(b);
        return b;
      }
      function lights(g, width, z) {
        for (const px of [-width, width]) {
          let l = new T.Mesh(
            new T.CylinderGeometry(0.34, 0.34, 0.12, 20),
            lamp,
          );
          l.rotation.x = Math.PI / 2;
          l.position.set(px, 1.65, z);
          g.add(l);
          const beam = new T.SpotLight(0xfff2c7, 55, 42, 0.42, 0.5, 1.4);
          beam.position.set(px, 1.7, z - 0.25);
          beam.target.position.set(px, 0, z - 30);
          g.add(beam, beam.target);
        }
      }
      function mirrors(g, w, z) {
        for (const px of [-w, w]) {
          part(g, 0.18, 0.22, 1.2, 0x1b2229, px, 3.2, z);
          const m = part(
            g,
            0.16,
            0.85,
            0.62,
            0x9fb7c2,
            px + (px < 0 ? -0.18 : 0.18),
            3.35,
            z - 0.55,
          );
          m.material = chrome;
        }
      }
      function interior(g, bus) {
        part(g, bus ? 4.7 : 3.7, 0.72, 1.4, 0x171d25, 0, 2.25, -3.1);
        const st = new T.Mesh(new T.TorusGeometry(0.56, 0.1, 12, 30), tire);
        st.position.set(-1.25, 2.75, -3.75);
        st.rotation.x = Math.PI / 2;
        g.add(st);
        for (let i = 0; i < 5; i++) {
          const gauge = new T.Mesh(
            new T.CircleGeometry(0.14, 18),
            mat(i % 2 ? 0x65d9ff : 0xffffff, 0.2),
          );
          gauge.position.set(-0.65 + i * 0.32, 2.55, -3.82);
          gauge.rotation.x = -Math.PI / 2;
          g.add(gauge);
        }
        for (let r = 0; r < (bus ? 6 : 1); r++)
          for (const px of bus ? [-1.45, 1.45] : [-1.25]) {
            part(
              g,
              1.05,
              1.25,
              0.9,
              bus ? 0x285475 : 0x343b45,
              px,
              1.45,
              r * 2 - 1,
            );
            part(
              g,
              1.05,
              0.35,
              0.45,
              bus ? 0x32688f : 0x414b57,
              px,
              2.2,
              r * 2 - 0.72,
            );
          }
      }
      function build(type) {
        if (V) S.remove(V);
        kind = type;
        const g = new T.Group(),
          bus = type === "bus";
        if (bus) {
          part(g, 5.3, 3.7, 13.6, 0x2389b7, 0, 2.55, 0);
          part(g, 5.15, 0.55, 13.2, 0x18232c, 0, 4.65, 0);
          let wind = part(g, 4.5, 2, 0.12, 0x173d52, 0, 3.45, -6.87);
          wind.material = glass;
          for (let r = -4.9; r <= 5; r += 2.2)
            for (const p of [-2.66, 2.66]) {
              const w = part(g, 0.1, 1.55, 1.55, 0x173d52, p, 3.35, r);
              w.material = glass;
            }
          part(g, 0.12, 2.75, 1.1, 0x152a37, 2.67, 2.55, -4.8);
          part(g, 0.15, 3.2, 1.05, 0xd3d9dc, 2.66, 2.45, -3.55);
          for (const z of [-4.8, 4.8])
            for (const p of [-2.5, 2.5]) g.add(wheel(p, z));
          lights(g, 1.65, -6.95);
          mirrors(g, 3, -5.25);
          for (const p of [-1.9, 1.9]) {
            const l = part(g, 0.55, 0.55, 0.12, 0xe51c3a, p, 1.55, 6.87);
            l.material = red;
          }
        } else {
          part(g, 5, 3.8, 5.4, 0x19b7ad, 0, 2.7, -4.25);
          const roof = part(g, 4.65, 0.55, 4.8, 0x127d79, 0, 4.85, -4.15);
          roof.rotation.x = 0.035;
          part(g, 5.1, 4.5, 11.8, 0xd4dbe0, 0, 3, 4.5);
          part(g, 5.18, 0.28, 11.5, 0x159b95, 0, 1.45, 4.5);
          let wind = part(g, 4.15, 1.75, 0.12, 0x173d52, 0, 3.55, -6.97);
          wind.material = glass;
          for (const p of [-2.5, 2.5]) {
            let side = part(g, 0.12, 1.35, 1.7, 0x173d52, p, 3.45, -4.85);
            side.material = glass;
          }
          part(g, 4.45, 0.55, 0.4, 0x16242c, 0, 1.35, -7.08);
          part(g, 3.1, 0.45, 0.2, 0x26333d, 0, 2.3, -7.12);
          for (const z of [-4.6, 1.5, 7.5])
            for (const p of [-2.45, 2.45]) g.add(wheel(p, z));
          lights(g, 1.55, -7.2);
          mirrors(g, 2.9, -5.55);
          for (const p of [-1.8, 1.8]) {
            const l = part(g, 0.55, 0.7, 0.12, 0xe51c3a, p, 1.8, 10.42);
            l.material = red;
          }
        }
        interior(g, bus);
        g.traverse((o) => {
          if (o.isMesh) {
            o.castShadow = true;
            o.receiveShadow = true;
          }
        });
        V = g;
        V.position.set(0, 0, 60);
        S.add(V);
        vn.textContent = bus ? "Nortia Urbano X8" : "Aster Viento 3D";
        truck.classList.toggle("on", !bus);
        document.querySelector("#bus").classList.toggle("on", bus);
      }
      function camera() {
        const p = V.position;
        if (view === 0) {
          C.position.lerp(new T.Vector3(p.x + 10, 9, p.z + 18), 0.12);
          C.lookAt(p.x, 2, p.z - 10);
        } else if (view === 1) {
          C.position.set(p.x - 1.15, 3.1, p.z - 3.5);
          C.lookAt(p.x - 1.1, 2.8, p.z - 35);
        } else {
          C.position.set(p.x, 3.2, p.z + (kind === "bus" ? 4 : 5));
          C.lookAt(p.x, 2.4, p.z - 25);
        }
      }
      document.querySelectorAll("[data-key]").forEach((b) => {
        const k = b.dataset.key;
        b.onpointerdown = (e) => {
          e.preventDefault();
          keys[k] = 1;
        };
        ["pointerup", "pointercancel", "pointerleave"].forEach((v) =>
          b.addEventListener(v, () => (keys[k] = 0)),
        );
      });
      onkeydown = (e) => (keys[e.key.toLowerCase()] = 1);
      onkeyup = (e) => (keys[e.key.toLowerCase()] = 0);
      truck.onclick = () => build("truck");
      document.querySelector("#bus").onclick = () => build("bus");
      cam.onclick = () => {
        view = (view + 1) % 3;
        document.querySelector("#view").textContent = [
          "Exterior",
          "Cabina",
          "Interior trasero",
        ][view];
      };
      full.onclick = () =>
        document.fullscreenElement
          ? document.exitFullscreen()
          : document.documentElement.requestFullscreen();
      let last = performance.now();
      function loop(now) {
        const dt = Math.min(0.04, (now - last) / 1000);
        last = now;
        speed += ((keys.w ? 34 : 0) - (keys.s ? 55 : 7)) * dt;
        speed = T.MathUtils.clamp(speed, 0, kind === "bus" ? 92 : 112);
        steer += (keys.a ? 1 : keys.d ? -1 : 0) * dt * 1.7;
        steer *= Math.pow(0.28, dt);
        V.position.x = T.MathUtils.clamp(
          V.position.x + steer * speed * dt * 0.045,
          -10.5,
          10.5,
        );
        V.position.z -= speed * dt * 0.17;
        if (V.position.z < -400) V.position.z = 400;
        V.rotation.z = steer * 0.07;
        document.querySelector("#speed").textContent =
          Math.round(speed) + " km/h";
        document.querySelector("#city").textContent = [
          "Nova Liria",
          "Puerto Alba",
          "Valleverde",
          "Bahía Solar",
        ][Math.max(0, Math.floor((420 - V.position.z) / 205) % 4)];
        camera();
        R.render(S, C);
        requestAnimationFrame(loop);
      }
      build("truck");
      onresize = () => {
        C.aspect = innerWidth / innerHeight;
        C.updateProjectionMatrix();
        R.setSize(innerWidth, innerHeight);
      };
      requestAnimationFrame(loop);
      const traffic3d = [];
      for (let i = 0; i < [3, 5, 9, 14][qualityLevel]; i++) {
        const g = new T.Group(),
          c = [0xe34d64, 0x4c7ee8, 0xf1b84b, 0x54bd82][i % 4];
        part(g, 2.7, 0.8, 5, c, 0, 1, 0);
        part(g, 2.25, 0.7, 2.3, 0x19384d, 0, 1.65, 0.1);
        for (const z of [-1.6, 1.6])
          for (const px of [-1.3, 1.3]) g.add(wheel(px, z));
        g.position.set([-8, 0, 8][i % 3], 0, 30 - i * 90);
        S.add(g);
        traffic3d.push(g);
      }
      const rainGeo = new T.BufferGeometry(),
        rainPos = new Float32Array([240, 540, 1200, 2400][qualityLevel]);
      for (let i = 0; i < rainPos.length; i += 3) {
        rainPos[i] = (Math.random() - 0.5) * 90;
        rainPos[i + 1] = Math.random() * 45;
        rainPos[i + 2] = (Math.random() - 0.5) * 180;
      }
      rainGeo.setAttribute("position", new T.BufferAttribute(rainPos, 3));
      const rain = new T.Points(
        rainGeo,
        new T.PointsMaterial({
          color: 0xb9e7ff,
          size: 0.12,
          transparent: true,
          opacity: 0.65,
        }),
      );
      rain.visible = false;
      S.add(rain);
      let weatherMode = 0;
      const weatherButton = document.createElement("button");
      weatherButton.textContent = "Clima: despejado";
      weatherButton.onclick = () => {
        weatherMode = (weatherMode + 1) % 3;
        rain.visible = weatherMode === 1;
        weatherButton.textContent = [
          "Clima: despejado",
          "Clima: lluvia",
          "Hora: noche",
        ][weatherMode];
        S.background.set(
          weatherMode === 2
            ? 0x050916
            : weatherMode === 1
              ? 0x526b78
              : 0x87c8ed,
        );
        S.fog.color.set(
          weatherMode === 2
            ? 0x091126
            : weatherMode === 1
              ? 0x607682
              : 0xa6d0e5,
        );
        sun.intensity = weatherMode === 2 ? 0.45 : weatherMode === 1 ? 1.3 : 3;
      };
      document.querySelector(".controls").appendChild(weatherButton);
      function worldLoop() {
        if (V) {
          for (let i = 0; i < traffic3d.length; i++) {
            const o = traffic3d[i];
            o.position.z += 0.2 + i * 0.012;
            if (o.position.z > V.position.z + 80)
              o.position.z = V.position.z - 360 - Math.random() * 240;
          }
          rain.position.set(V.position.x, 0, V.position.z - 30);
          if (rain.visible) {
            const a = rain.geometry.attributes.position.array;
            for (let i = 1; i < a.length; i += 3) {
              a[i] -= 0.65;
              if (a[i] < 0) a[i] = 45;
            }
            rain.geometry.attributes.position.needsUpdate = true;
          }
        }
        requestAnimationFrame(worldLoop);
      }
      requestAnimationFrame(worldLoop);
    </script>
    <script>
      var vn = document.querySelector("#vn"),
        truck = document.querySelector("#truck"),
        cam = document.querySelector("#cam"),
        full = document.querySelector("#full");
      const mode2d = document.createElement("button");
      mode2d.textContent = "Cambiar a 2D";
      mode2d.onclick = () => {
        try {
          parent.document.querySelector('[data-game="hauler"]').click();
        } catch (e) {
          location.href = "/hub-games.html?game=hauler";
        }
      };
      document.querySelector(".controls").appendChild(mode2d);
    </script>
  </body>
</html>
