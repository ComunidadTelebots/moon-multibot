<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Rutas 3D</title><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#07101b;color:#fff;font:14px system-ui}canvas{display:block}.hud,.controls{position:fixed;z-index:2;display:flex;gap:7px;flex-wrap:wrap}.hud{inset:10px 10px auto}.controls{left:10px;bottom:10px}.drive{left:auto;right:10px}.pill,button{padding:9px 12px;border:1px solid #36536c;border-radius:11px;background:#07101ddd;color:#fff}.pill b,button.on{color:#4ce6d0}button{font-weight:700}.mobile{display:none}@media(max-width:700px){.mobile{display:flex}.hud{font-size:11px}.pill,button{padding:8px}}</style></head><body><div class="hud"><div class="pill">Vehículo <b id="vn">Aster Viento 3D</b></div><div class="pill">Vista <b id="view">Exterior</b></div><div class="pill">Velocidad <b id="speed">0 km/h</b></div><div class="pill">Ciudad <b id="city">Nova Liria</b></div></div><div class="controls"><button id="truck" class="on">Camión</button><button id="bus">Autobús</button><button id="cam">Vista</button><button id="full">⛶</button></div><div class="controls drive"><button class="mobile" data-key="a">◀</button><button data-key="s">Freno</button><button data-key="w">Acelerar</button><button class="mobile" data-key="d">▶</button></div><script type="module">
import * as T from './vendor/three.module.min.js';const S=new T.Scene();S.background=new T.Color(0x87c8ed);S.fog=new T.Fog(0xa6d0e5,90,430);const C=new T.PerspectiveCamera(65,innerWidth/innerHeight,.1,900),R=new T.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,1.7));R.setSize(innerWidth,innerHeight);R.shadowMap.enabled=true;R.outputColorSpace=T.SRGBColorSpace;document.body.prepend(R.domElement);S.add(new T.HemisphereLight(0xe8f7ff,0x385329,2.2));const sun=new T.DirectionalLight(0xffedc4,3);sun.position.set(-70,110,-40);sun.castShadow=true;S.add(sun);const mat=(c,r=.65,m=.08)=>new T.MeshStandardMaterial({color:c,roughness:r,metalness:m}),box=(w,h,d,c)=>{const x=new T.Mesh(new T.BoxGeometry(w,h,d),mat(c));x.castShadow=x.receiveShadow=true;return x};let x=box(500,1,900,0x4d8943);x.position.y=-.6;S.add(x);x=box(30,.25,900,0x292e35);S.add(x);for(let z=-430;z<450;z+=18){x=box(.35,.05,8,0xf5df95);x.position.set(0,.17,z);S.add(x)}

let V,kind='truck',view=0,speed=0,steer=0,keys={};const tire=mat(0x090b0e,.92),glass=new T.MeshPhysicalMaterial({color:0x17445d,roughness:.08,metalness:.15,transparent:true,opacity:.76,transmission:.18}),chrome=mat(0xb8c3c9,.18,.88),lamp=mat(0xfff0b0,.12,.25),red=mat(0xe51c3a,.2,.2);function wheel(px,pz){const w=new T.Group(),t=new T.Mesh(new T.CylinderGeometry(1.05,1.05,.7,28),tire),hub=new T.Mesh(new T.CylinderGeometry(.5,.5,.73,20),chrome);t.rotation.z=hub.rotation.z=Math.PI/2;w.add(t,hub);w.position.set(px,1,pz);return w}function part(g,w,h,d,c,px,py,pz){const b=box(w,h,d,c);b.position.set(px,py,pz);g.add(b);return b}function lights(g,width,z){for(const px of[-width,width]){let l=new T.Mesh(new T.CylinderGeometry(.34,.34,.12,20),lamp);l.rotation.x=Math.PI/2;l.position.set(px,1.65,z);g.add(l);const beam=new T.SpotLight(0xfff2c7,55,42,.42,.5,1.4);beam.position.set(px,1.7,z-.25);beam.target.position.set(px,0,z-30);g.add(beam,beam.target)}}function mirrors(g,w,z){for(const px of[-w,w]){part(g,.18,.22,1.2,0x1b2229,px,3.2,z);const m=part(g,.16,.85,.62,0x9fb7c2,px+(px<0?-.18:.18),3.35,z-.55);m.material=chrome}}function interior(g,bus){part(g,bus?4.7:3.7,.72,1.4,0x171d25,0,2.25,-3.1);const st=new T.Mesh(new T.TorusGeometry(.56,.1,12,30),tire);st.position.set(-1.25,2.75,-3.75);st.rotation.x=Math.PI/2;g.add(st);for(let i=0;i<5;i++){const gauge=new T.Mesh(new T.CircleGeometry(.14,18),mat(i%2?0x65d9ff:0xffffff,.2));gauge.position.set(-.65+i*.32,2.55,-3.82);gauge.rotation.x=-Math.PI/2;g.add(gauge)}for(let r=0;r<(bus?6:1);r++)for(const px of bus?[-1.45,1.45]:[-1.25]){part(g,1.05,1.25,.9,bus?0x285475:0x343b45,px,1.45,r*2-1);part(g,1.05,.35,.45,bus?0x32688f:0x414b57,px,2.2,r*2-.72)}}function build(type){if(V)S.remove(V);kind=type;const g=new T.Group(),bus=type==='bus';if(bus){part(g,5.3,3.7,13.6,0x2389b7,0,2.55,0);part(g,5.15,.55,13.2,0x18232c,0,4.65,0);let wind=part(g,4.5,2,.12,0x173d52,0,3.45,-6.87);wind.material=glass;for(let r=-4.9;r<=5;r+=2.2)for(const p of[-2.66,2.66]){const w=part(g,.1,1.55,1.55,0x173d52,p,3.35,r);w.material=glass}part(g,.12,2.75,1.1,0x152a37,2.67,2.55,-4.8);part(g,.15,3.2,1.05,0xd3d9dc,2.66,2.45,-3.55);for(const z of[-4.8,4.8])for(const p of[-2.5,2.5])g.add(wheel(p,z));lights(g,1.65,-6.95);mirrors(g,3,-5.25);for(const p of[-1.9,1.9]){const l=part(g,.55,.55,.12,0xe51c3a,p,1.55,6.87);l.material=red}}else{part(g,5,3.8,5.4,0x19b7ad,0,2.7,-4.25);const roof=part(g,4.65,.55,4.8,0x127d79,0,4.85,-4.15);roof.rotation.x=.035;part(g,5.1,4.5,11.8,0xd4dbe0,0,3,4.5);part(g,5.18,.28,11.5,0x159b95,0,1.45,4.5);let wind=part(g,4.15,1.75,.12,0x173d52,0,3.55,-6.97);wind.material=glass;for(const p of[-2.5,2.5]){let side=part(g,.12,1.35,1.7,0x173d52,p,3.45,-4.85);side.material=glass}part(g,4.45,.55,.4,0x16242c,0,1.35,-7.08);part(g,3.1,.45,.2,0x26333d,0,2.3,-7.12);for(const z of[-4.6,1.5,7.5])for(const p of[-2.45,2.45])g.add(wheel(p,z));lights(g,1.55,-7.2);mirrors(g,2.9,-5.55);for(const p of[-1.8,1.8]){const l=part(g,.55,.7,.12,0xe51c3a,p,1.8,10.42);l.material=red}}interior(g,bus);g.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});V=g;V.position.set(0,0,60);S.add(V);vn.textContent=bus?'Nortia Urbano X8':'Aster Viento 3D';truck.classList.toggle('on',!bus);document.querySelector('#bus').classList.toggle('on',bus)}
function camera(){const p=V.position;if(view===0){C.position.lerp(new T.Vector3(p.x+10,9,p.z+18),.12);C.lookAt(p.x,2,p.z-10)}else if(view===1){C.position.set(p.x-1.15,3.1,p.z-3.5);C.lookAt(p.x-1.1,2.8,p.z-35)}else{C.position.set(p.x,3.2,p.z+(kind==='bus'?4:5));C.lookAt(p.x,2.4,p.z-25)}}document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;b.onpointerdown=e=>{e.preventDefault();keys[k]=1};['pointerup','pointercancel','pointerleave'].forEach(v=>b.addEventListener(v,()=>keys[k]=0))});onkeydown=e=>keys[e.key.toLowerCase()]=1;onkeyup=e=>keys[e.key.toLowerCase()]=0;truck.onclick=()=>build('truck');document.querySelector('#bus').onclick=()=>build('bus');cam.onclick=()=>{view=(view+1)%3;document.querySelector('#view').textContent=['Exterior','Cabina','Interior trasero'][view]};full.onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();let last=performance.now();function loop(now){const dt=Math.min(.04,(now-last)/1000);last=now;speed+=((keys.w?34:0)-(keys.s?55:7))*dt;speed=T.MathUtils.clamp(speed,0,kind==='bus'?92:112);steer+=(keys.a?1:keys.d?-1:0)*dt*1.7;steer*=Math.pow(.28,dt);V.position.x=T.MathUtils.clamp(V.position.x+steer*speed*dt*.045,-10.5,10.5);V.position.z-=speed*dt*.17;if(V.position.z<-400)V.position.z=400;V.rotation.z=steer*.07;document.querySelector('#speed').textContent=Math.round(speed)+' km/h';document.querySelector('#city').textContent=['Nova Liria','Puerto Alba','Valleverde','Bahía Solar'][Math.max(0,Math.floor((420-V.position.z)/205)%4)];camera();R.render(S,C);requestAnimationFrame(loop)}build('truck');onresize=()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)};requestAnimationFrame(loop);
