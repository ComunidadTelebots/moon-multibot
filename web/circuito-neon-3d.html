<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Circuito Neón 3D</title><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#030510;color:#fff;font:14px system-ui}canvas{display:block}.hud,.bar{position:fixed;z-index:3;display:flex;gap:7px;flex-wrap:wrap}.hud{inset:10px 10px auto}.bar{left:10px;bottom:10px}.drive{left:auto;right:10px}.pill,button{padding:9px 12px;border:1px solid #27537b;border-radius:11px;background:#050916df;color:#fff;box-shadow:0 0 18px #00d9ff24}.pill b,button.on{color:#25efff}button{font-weight:750}.mobile{display:none}@media(max-width:700px){.mobile{display:flex}.pill,button{padding:8px;font-size:12px}}</style></head><body><div class="hud"><div class="pill">Coche <b>Velaris NX</b></div><div class="pill">Velocidad <b id="speed">0 km/h</b></div><div class="pill">Distancia <b id="distance">0 m</b></div><div class="pill">Vista <b id="view">Exterior</b></div></div><div class="bar"><button id="cam">Cambiar vista</button><button id="mode2d">Versión 2D</button><button id="full">⛶</button></div><div class="bar drive"><button class="mobile" data-key="a">◀</button><button data-key="s">Freno</button><button data-key="w">Acelerar</button><button class="mobile" data-key="d">▶</button></div><script type="module">
import * as T from './vendor/three.module.min.js';const S=new T.Scene();S.background=new T.Color(0x02030b);S.fog=new T.FogExp2(0x07102a,.007);const C=new T.PerspectiveCamera(68,innerWidth/innerHeight,.1,700),R=new T.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,1.8));R.setSize(innerWidth,innerHeight);R.shadowMap.enabled=true;R.outputColorSpace=T.SRGBColorSpace;R.toneMapping=T.ACESFilmicToneMapping;R.toneMappingExposure=1.25;document.body.prepend(R.domElement);S.add(new T.HemisphereLight(0x597cff,0x080512,1.5));const key=new T.DirectionalLight(0xbddcff,2.2);key.position.set(-25,50,20);key.castShadow=true;S.add(key);const mat=(c,r=.45,m=.2,e=0)=>new T.MeshStandardMaterial({color:c,roughness:r,metalness:m,emissive:c,emissiveIntensity:e}),box=(w,h,d,c,r,m,e)=>{const x=new T.Mesh(new T.BoxGeometry(w,h,d),mat(c,r,m,e));x.castShadow=x.receiveShadow=true;return x};const road=box(30,.3,1000,0x090c18,.28,.35);S.add(road);for(let z=-490;z<500;z+=16){let l=box(.25,.05,7,0x00dfff,.2,.3,4);l.position.set(0,.22,z);S.add(l);for(const x of[-14.6,14.6]){l=box(.25,.12,13,0xff22bd,.18,.35,5);l.position.set(x,.28,z);S.add(l)}}
for(let z=-470;z<500;z+=38){for(const side of[-1,1]){const pole=box(.3,7,.3,0x10172a,.35,.7);pole.position.set(side*17,3.5,z);S.add(pole);const lamp=box(2.8,.18,.24,side<0?0x00ddff:0xff26bd,.15,.3,8);lamp.position.set(side*15.6,7,z);S.add(lamp)}}for(let n=-9;n<=9;n++)for(const side of[-1,1])for(let i=0;i<4;i++){const h=15+((n*31+i*17+400)%58),b=box(10+i%2*5,h,10+i%3*3,[0x101a35,0x18142d,0x0b2534][(i+n+20)%3],.42,.35);b.position.set(side*(29+i%2*15),h/2,n*55+(i-2)*13);S.add(b);for(let y=4;y<h;y+=5){const strip=box(.1,.25,b.geometry.parameters.depth*.7,i%2?0xff30c7:0x26eaff,.15,.2,4);strip.position.set(b.position.x-side*(b.geometry.parameters.width/2+.06),y,b.position.z);S.add(strip)}}
const tire=mat(0x050609,.9,.15),glass=new T.MeshPhysicalMaterial({color:0x082b44,roughness:.05,metalness:.25,transparent:true,opacity:.72,transmission:.2}),chrome=mat(0x9bb5c5,.14,.9);function wheel(x,z){const g=new T.Group(),t=new T.Mesh(new T.CylinderGeometry(.62,.62,.42,28),tire),h=new T.Mesh(new T.CylinderGeometry(.28,.28,.44,18),chrome);t.rotation.z=h.rotation.z=Math.PI/2;g.add(t,h);g.position.set(x,.72,z);return g}const car=new T.Group();let p=box(3.4,.7,6.4,0x04bfd0,.2,.72);p.position.y=1;car.add(p);p=box(2.85,.75,3.1,0x087e9d,.14,.68);p.position.set(0,1.65,.25);car.add(p);const windshield=box(2.45,.7,.08,0x123b55);windshield.position.set(0,1.72,-1.36);windshield.rotation.x=-.2;windshield.material=glass;car.add(windshield);const rear=windshield.clone();rear.position.z=1.82;rear.rotation.x=.2;car.add(rear);for(const z of[-2.05,2.05])for(const x of[-1.65,1.65])car.add(wheel(x,z));for(const x of[-1.1,1.1]){let l=box(.65,.22,.12,0xeaffff,.12,.3,7);l.position.set(x,1,-3.24);car.add(l);const spot=new T.SpotLight(0xb8f7ff,70,55,.35,.5,1.3);spot.position.set(x,1,-3.35);spot.target.position.set(x,0,-40);car.add(spot,spot.target);l=box(.55,.24,.12,0xff174f,.12,.2,5);l.position.set(x,1,3.24);car.add(l)}const dash=box(2.7,.38,.75,0x111522,.5,.35);dash.position.set(0,1.42,-.9);car.add(dash);const steering=new T.Mesh(new T.TorusGeometry(.35,.07,10,25),tire);steering.position.set(-.75,1.63,-1.25);steering.rotation.x=Math.PI/2;car.add(steering);S.add(car);car.position.z=50;
const traffic=[];function spawn(){const g=new T.Group(),color=[0xff315f,0x715cff,0xffc62b,0x36df84][Math.floor(Math.random()*4)];let b=box(3,.7,5.5,color,.25,.55);b.position.y=.95;g.add(b);b=box(2.5,.65,2.5,0x18334b,.1,.5);b.position.set(0,1.58,.1);g.add(b);for(const z of[-1.8,1.8])for(const x of[-1.45,1.45])g.add(wheel(x,z));g.position.set([-8,0,8][Math.floor(Math.random()*3)],0,car.position.z-180-Math.random()*170);S.add(g);traffic.push(g)}let speed=0,steer=0,meters=0,viewMode=0,keys={};function camera(){if(viewMode===0){C.position.lerp(new T.Vector3(car.position.x+7,5.3,car.position.z+10),.14);C.lookAt(car.position.x,1,car.position.z-14)}else{C.position.set(car.position.x-.7,1.72,car.position.z-.65);C.lookAt(car.position.x-.7,1.55,car.position.z-35)}}document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;b.onpointerdown=e=>{e.preventDefault();keys[k]=1};['pointerup','pointercancel','pointerleave'].forEach(v=>b.addEventListener(v,()=>keys[k]=0))});window.onkeydown=e=>keys[e.key.toLowerCase()]=1;window.onkeyup=e=>keys[e.key.toLowerCase()]=0;document.querySelector('#cam').onclick=()=>{viewMode=1-viewMode;document.querySelector('#view').textContent=viewMode?'Cockpit':'Exterior'};document.querySelector('#mode2d').onclick=()=>{try{parent.document.querySelector('[data-game="race"]').click()}catch(e){location.href='/hub-games.html?game=race'}};document.querySelector('#full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();let last=performance.now(),spawnAt=0;function loop(now){const dt=Math.min(.04,(now-last)/1000);last=now;speed+=((keys.w?48:0)-(keys.s?75:10))*dt;speed=T.MathUtils.clamp(speed,0,210);steer+=(keys.a?1:keys.d?-1:0)*dt*2.2;steer*=Math.pow(.2,dt);car.position.x=T.MathUtils.clamp(car.position.x+steer*speed*dt*.032,-10.7,10.7);car.position.z-=speed*dt*.18;car.rotation.z=steer*.06;meters+=speed*dt/3.6;if(car.position.z<spawnAt){spawnAt=car.position.z-95;spawn()}for(const o of traffic){o.position.z+=dt*13;if(Math.abs(o.position.z-car.position.z)<5&&Math.abs(o.position.x-car.position.x)<2.8){speed*=.35;o.position.x=T.MathUtils.clamp(o.position.x+(o.position.x>car.position.x?3:-3),-9,9)}}while(traffic.length&&traffic[0].position.z>car.position.z+60)S.remove(traffic.shift());document.querySelector('#speed').textContent=Math.round(speed)+' km/h';document.querySelector('#distance').textContent=Math.floor(meters)+' m';camera();R.render(S,C);requestAnimationFrame(loop)}onresize=()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)};requestAnimationFrame(loop);
</script></body></html>
