<div class="glass-panel">
    <h3>🛠️ Centro de Diagnóstico Moon</h3>
    <div id="diagStatus" class="diag-grid">
        <div class="diag-card">Servidor: <span id="diag-server">---</span></div>
        <div class="diag-card">DB: <span id="diag-db">---</span></div>
        <div class="diag-card">IA: <span id="diag-ia">---</span></div>
        <div class="diag-card">Bots: <span id="diag-bots">---</span></div>
    </div>
    <div id="diagConsole" class="log-container" style="height: 300px; margin-top: 20px;"></div>
    <button onclick="runDiagnostics()" class="btn-primary" style="margin-top: 10px;">Ejecutar Test Completo</button>
</div>

<div class="glass-panel" style="margin-top: 25px; border-left: 3px solid var(--danger);">
    <h3>🕵️ Gestor de Procesos (Zombies)</h3>
    <p style="font-size: 11px; color: #94a3b8; margin-bottom: 15px;">Detección de instancias duplicadas del bot. Solo se permite una instancia "Master" activa.</p>
    <div id="processList" class="process-list" style="display: flex; flex-direction: column; gap: 10px;">
        <div style="text-align: center; padding: 20px; color: #64748b;">Consultando procesos activos...</div>
    </div>
    <button onclick="fetchMoonProcesses()" class="btn-mini-wide" style="margin-top: 15px; width: auto; padding: 8px 15px;">REFRESCAR PROCESOS</button>
</div>

<style>
.process-card {
    background: rgba(0,0,0,0.2); border: 1px solid var(--glass-border);
    padding: 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center;
}
.process-card.self { border-color: var(--primary); background: rgba(139,92,246,0.05); }
.process-card.zombie { border-color: var(--danger); }
.proc-info b { color: var(--primary); font-size: 13px; }
.proc-info small { color: #64748b; font-size: 10px; }
.badge-role { font-size: 9px; padding: 2px 6px; border-radius: 4px; margin-left: 8px; font-weight: 800; }
.role-master { background: #3b82f633; color: #3b82f6; border: 1px solid #3b82f644; }
.role-slave { background: #10b98133; color: #10b981; border: 1px solid #10b98144; }
</style>
