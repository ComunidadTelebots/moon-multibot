<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Puerto Logístico</title><style>*{box-sizing:border-box}body{margin:0;background:#07101b;color:#eef7ff;font:14px system-ui;overflow:hidden}canvas{display:block;width:100vw;height:100vh;touch-action:none}.hud,.tools{position:fixed;display:flex;gap:7px;flex-wrap:wrap}.hud{inset:10px 10px auto}.tools{inset:auto 10px 10px;justify-content:center}.pill,button{border:1px solid #36536c;border-radius:10px;background:#07101ddd;color:#fff;padding:9px}.pill b,button.on{color:#51e5cf}button{font-weight:800}@media(max-width:600px){.hud{font-size:11px}.tools{justify-content:space-between}button{padding:12px 8px}}</style></head><body><canvas id="game"></canvas><div class="hud"><span class="pill">Tiempo <b id="time">90</b></span><span class="pill">Carga <b id="score">0/5</b></span><span class="pill">Vehículo <b id="vehicle">Traspaleta</b></span><span class="pill">Estado <b id="state">Pulsa iniciar</b></span></div><div class="tools"><button id="left">◀</button><button id="up">▲</button><button id="down">▼</button><button id="right">▶</button><button id="tool">Cambiar vehículo</button><button id="grab">Recoger</button><button id="start" class="on">Iniciar</button></div><script>
const c=document.querySelector('#game'),x=c.getContext('2d'),keys={},p={x:120,y:300,a:0,held:null},pallets=[],dock={x:0,y:0,w:120,h:155};let running=false,scoreN=0,end=0,forklift=false;function resize(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);dock.x=innerWidth-145;dock.y=innerHeight/2-75;draw()}onresize=resize;function reset(){p.x=100;p.y=innerHeight/2;p.held=null;scoreN=0;pallets.length=0;for(let i=0;i<5;i++)pallets.push({x:innerWidth*.25+Math.random()*innerWidth*.45,y:90+Math.random()*(innerHeight-190),done:false,c:['#ef9d3c','#4ea1e8','#55bd7b'][i%3]});end=performance.now()+90000;running=true;score.textContent='0/5';state.textContent='Carga los palés en el muelle';requestAnimationFrame(loop)}function draw(){x.fillStyle='#17232b';x.fillRect(0,0,innerWidth,innerHeight);x.strokeStyle='#35454e';for(let q=0;q<innerWidth;q+=55){x.beginPath();x.moveTo(q,0);x.lineTo(q,innerHeight);x.stroke()}for(let q=0;q<innerHeight;q+=55){x.beginPath();x.moveTo(0,q);x.lineTo(innerWidth,q);x.stroke()}x.fillStyle='#163c37';x.fillRect(dock.x,dock.y,dock.w,dock.h);x.strokeStyle='#55e3cd';x.lineWidth=4;x.strokeRect(dock.x,dock.y,dock.w,dock.h);x.fillStyle='#dff';x.fillText('MUELLE',dock.x+28,dock.y+22);for(const q of pallets){if(q.done||q===p.held)continue;x.fillStyle='#87582f';x.fillRect(q.x-17,q.y-12,34,24);x.fillStyle=q.c;x.fillRect(q.x-14,q.y-16,28,18)}if(p.held){x.fillStyle=p.held.c;x.fillRect(p.x-14,p.y-33,28,18)}x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=forklift?'#e9a91f':'#d7473d';x.fillRect(-18,-25,36,50);x.fillStyle='#202b31';x.fillRect(-15,-22,30,17);x.fillStyle='#77858c';x.fillRect(-16,-34,5,18);x.fillRect(11,-34,5,18);x.restore()}function grab(){if(!running)return;if(p.held){if(p.x>dock.x&&p.y>dock.y&&p.y<dock.y+dock.h){p.held.done=true;p.held=null;scoreN++;score.textContent=scoreN+'/5';if(scoreN===5){running=false;state.textContent='Trabajo completado'}}return}const q=pallets.find(v=>!v.done&&Math.hypot(v.x-p.x,v.y-p.y)<55);if(q)p.held=q;else state.textContent='Acércate al palé'}function loop(now){if(!running){draw();return}const l=keys.a||keys.ArrowLeft,r=keys.d||keys.ArrowRight,u=keys.w||keys.ArrowUp,d=keys.s||keys.ArrowDown,s=(forklift?190:140)/60;p.x=Math.max(25,Math.min(innerWidth-25,p.x+(r-l)*s));p.y=Math.max(65,Math.min(innerHeight-60,p.y+(d-u)*s));if(l||r||u||d)p.a=Math.atan2(r-l,u-d);if(p.held){p.held.x=p.x;p.held.y=p.y}const remain=Math.max(0,Math.ceil((end-now)/1000));time.textContent=remain;if(!remain){running=false;state.textContent='Tiempo agotado'}draw();requestAnimationFrame(loop)}onkeydown=e=>{keys[e.key]=1;if(e.key==='e')grab()};onkeyup=e=>keys[e.key]=0;for(const [id,key] of [['left','a'],['right','d'],['up','w'],['down','s']]){const b=document.querySelector('#'+id);b.onpointerdown=()=>keys[key]=1;b.onpointerup=b.onpointercancel=()=>keys[key]=0}grab.onclick=grab;tool.onclick=()=>{forklift=!forklift;vehicle.textContent=forklift?'Carretilla':'Traspaleta'};start.onclick=reset;resize();
</script><script src="/games-logistics-network.js"></script><script>let shipmentCreated=false;document.querySelector('#grab').addEventListener('click',()=>setTimeout(()=>{if(scoreN===5&&!shipmentCreated){const cargo=MoonLogistics.create('Puerto Logístico');shipmentCreated=true;state.textContent=`${cargo.cargo} preparada para el tren`}},0));document.querySelector('#start').addEventListener('click',()=>shipmentCreated=false);</script></body></html>
