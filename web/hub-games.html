<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Juegos Moon</title>
<style>
:root{color-scheme:dark;--bg:#070b14;--card:#111722;--line:#263044;--text:#edf3ff;--muted:#8d9bb2;--blue:#2aabee;--teal:#5dcaa5}*{box-sizing:border-box}body{margin:0;padding:14px 12px 80px;background:var(--bg);color:var(--text);font:14px Inter,system-ui,sans-serif}.hero{padding:18px;border-radius:20px;background:linear-gradient(145deg,#2381cc,#17639f);margin-bottom:12px}.hero small{font-weight:800;letter-spacing:.12em}.hero h1{margin:7px 0 4px}.hero p{margin:0;opacity:.85}.tabs{display:flex;gap:7px;overflow:auto;margin:12px 0}.tabs button,.btn,.cell,.card,.dir{border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--text);cursor:pointer}.tabs button{padding:9px 12px;white-space:nowrap}.tabs button.on{border-color:var(--teal);color:var(--teal)}.game{display:none;padding:16px;border:1px solid var(--line);border-radius:18px;background:var(--card)}.game.on{display:block}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.head h2{margin:0}.muted{color:var(--muted)}canvas{display:block;width:min(100%,330px);height:auto;aspect-ratio:1;margin:auto;border:1px solid var(--line);border-radius:12px;background:#07101d;touch-action:none}.actions{display:flex;gap:8px;margin-top:12px}.btn{flex:1;padding:11px;font-weight:700}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.cell{height:72px;font-size:28px;font-weight:800}.memory{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.card{height:62px;font-size:25px}.dirs{display:grid;grid-template-columns:repeat(3,52px);justify-content:center;gap:5px;margin-top:12px}.dir{height:44px;font-size:20px}.dir.up{grid-column:2}.dir.left{grid-column:1}.dir.down{grid-column:2}.dir.right{grid-column:3}.status{text-align:center;margin:12px 0 0;color:var(--muted)}.royale-tools{display:flex;gap:7px;margin-bottom:10px}.royale-tools .btn.on{border-color:var(--teal);color:var(--teal)}#royale.stage-full{position:fixed;inset:0;z-index:9999;border:0;border-radius:0;padding:14px;background:var(--bg);overflow:auto}#royale.stage-full #royaleCanvas{width:min(100%,calc(100vh - 190px));max-width:none}#royale.stage-full .head,#royale.stage-full .royale-tools,#royale.stage-full .actions,#royale.stage-full .status{max-width:1100px;margin-left:auto;margin-right:auto}@media(min-width:800px){#royaleCanvas{width:min(100%,720px)}#royale .dirs{display:none}}
</style></head><body><header class="hero"><small>JUEGOS MOON</small><h1>Minijuegos del Hub</h1><p>Juega solo o compite desde Telegram.</p></header><nav class="tabs"><button class="on" data-game="snake">🐍 Snake</button><button data-game="royale">🧱 Block Royale</button><button data-game="ttt">❌ Tres en raya</button><button data-game="memory">🧠 Memoria</button></nav>
<section class="game on" id="snake"><div class="head"><h2>Snake</h2><span class="muted">Puntos: <b id="score">0</b></span></div><canvas id="canvas" width="300" height="300"></canvas><div class="dirs"><button class="dir up" data-dir="up">↑</button><button class="dir left" data-dir="left">←</button><button class="dir down" data-dir="down">↓</button><button class="dir right" data-dir="right">→</button></div><div class="actions"><button class="btn" id="snakeStart">Iniciar</button><button class="btn" id="snakeReset">Reiniciar</button></div><p class="status" id="snakeStatus">Usa la cruceta, flechas o WASD.</p></section>
<section class="game" id="royale"><div class="head"><h2>Block Royale</h2><span class="muted" id="royaleAlive">Sin conectar</span></div><div class="royale-tools"><button class="btn on" id="royaleTop">Vista superior</button><button class="btn" id="royaleFirst">Primera persona</button><button class="btn" id="royaleFull">⛶ Pantalla completa</button></div><canvas id="royaleCanvas" width="800" height="800"></canvas><div class="dirs"><button class="dir up" data-rmove="0,-1">↑</button><button class="dir left" data-rmove="-1,0">←</button><button class="dir down" data-rmove="0,1">↓</button><button class="dir right" data-rmove="1,0">→</button></div><div class="actions"><button class="btn" id="royaleJoin">Entrar</button><button class="btn" id="royaleShoot">Disparar</button></div><p class="status" id="royaleStatus">La zona se cierra. Toca el mapa para apuntar.</p></section>
<section class="game" id="ttt"><div class="head"><h2>Tres en raya</h2><span class="muted" id="tttStatus">Turno: X</span></div><div class="board" id="tttBoard"></div><div class="actions"><button class="btn" id="tttReset">Reiniciar</button></div></section>
<section class="game" id="memory"><div class="head"><h2>Memoria</h2><span class="muted">Movimientos: <b id="moves">0</b></span></div><div class="memory" id="memoryBoard"></div><div class="actions"><button class="btn" id="memoryReset">Mezclar</button></div></section>
<script>
const $=s=>document.querySelector(s);document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-game],.game').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('#'+b.dataset.game).classList.add('on')});
const canvas=$('#canvas'),ctx=canvas.getContext('2d'),cells=20,size=15;let snake,food,dir,timer,score;function foodPlace(){do{food={x:Math.floor(Math.random()*cells),y:Math.floor(Math.random()*cells)}}while(snake.some(p=>p.x===food.x&&p.y===food.y))}function snakeDraw(){ctx.clearRect(0,0,300,300);ctx.fillStyle='#5dcaa5';snake.forEach(p=>ctx.fillRect(p.x*size,p.y*size,size-1,size-1));ctx.fillStyle='#ff657a';ctx.fillRect(food.x*size,food.y*size,size-1,size-1)}function snakeReset(){clearInterval(timer);timer=null;snake=[{x:10,y:10}];dir={x:1,y:0};score=0;$('#score').textContent='0';$('#snakeStatus').textContent='Usa la cruceta, flechas o WASD.';foodPlace();snakeDraw()}function snakeStep(){const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.y<0||h.x>=cells||h.y>=cells||snake.some(p=>p.x===h.x&&p.y===h.y)){clearInterval(timer);timer=null;$('#snakeStatus').textContent=`Fin de partida · ${score} puntos`;return}snake.unshift(h);if(h.x===food.x&&h.y===food.y){score+=10;$('#score').textContent=score;foodPlace()}else snake.pop();snakeDraw()}function turn(k){if(k==='up'&&dir.y!==1)dir={x:0,y:-1};if(k==='down'&&dir.y!==-1)dir={x:0,y:1};if(k==='left'&&dir.x!==1)dir={x:-1,y:0};if(k==='right'&&dir.x!==-1)dir={x:1,y:0}}document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>turn(b.dataset.dir));addEventListener('keydown',e=>turn({arrowup:'up',w:'up',arrowdown:'down',s:'down',arrowleft:'left',a:'left',arrowright:'right',d:'right'}[e.key.toLowerCase()]));$('#snakeStart').onclick=()=>{if(!timer){$('#snakeStatus').textContent='Jugando…';timer=setInterval(snakeStep,110)}};$('#snakeReset').onclick=snakeReset;snakeReset();
let ttt,tttTurn,tttOver;const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];function tttWin(){for(const[a,b,c]of wins)if(ttt[a]&&ttt[a]===ttt[b]&&ttt[a]===ttt[c])return ttt[a];return ttt.every(Boolean)?'draw':''}function tttRender(){$('#tttBoard').innerHTML='';ttt.forEach((v,i)=>{const b=document.createElement('button');b.className='cell';b.textContent=v;b.onclick=()=>{if(tttOver||ttt[i])return;ttt[i]=tttTurn;const r=tttWin();if(r){tttOver=true;$('#tttStatus').textContent=r==='draw'?'Empate':`Gana ${r}`}else{tttTurn=tttTurn==='X'?'O':'X';$('#tttStatus').textContent=`Turno: ${tttTurn}`}tttRender()};$('#tttBoard').appendChild(b)})}function tttReset(){ttt=Array(9).fill('');tttTurn='X';tttOver=false;$('#tttStatus').textContent='Turno: X';tttRender()}$('#tttReset').onclick=tttReset;tttReset();
const icons=['🌙','🚀','🤖','🧠','⚡','🛡️','📡','💎'];let cards,open,lock,moves;function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function memRender(){$('#memoryBoard').innerHTML='';cards.forEach((c,i)=>{const b=document.createElement('button');b.className='card';b.textContent=c.open||c.done?c.v:'•';b.onclick=()=>{if(lock||c.open||c.done)return;c.open=true;open.push(i);memRender();if(open.length===2){moves++;$('#moves').textContent=moves;const[a,d]=open;if(cards[a].v===cards[d].v){cards[a].done=cards[d].done=true;open=[];memRender()}else{lock=true;setTimeout(()=>{cards[a].open=cards[d].open=false;open=[];lock=false;memRender()},650)}}};$('#memoryBoard').appendChild(b)})}function memReset(){moves=0;open=[];lock=false;$('#moves').textContent='0';cards=shuffle([...icons,...icons]).map(v=>({v,open:false,done:false}));memRender()}$('#memoryReset').onclick=memReset;memReset();
// Block Royale: identidad Telegram y simulación autoritativa en Moonbot.
const rc=$('#royaleCanvas'),rx=rc.getContext('2d');let rs=null,rt=null,angle=0,busy=false,rview='top';function initData(){try{return parent.Telegram?.WebApp?.initData||window.Telegram?.WebApp?.initData||''}catch(e){return''}}async function ra(action,extra={}){try{const r=await fetch('/api/public/games/royale',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,initData:initData(),...extra})}),d=await r.json();if(!d.ok)throw Error(d.error||'No disponible');rs=d;rd();return true}catch(e){$('#royaleStatus').textContent=e.message;return false}}function firstDraw(){const me=(rs?.players||[]).find(p=>p.id===rs.you);if(!me)return;const sky=rx.createLinearGradient(0,0,0,400);sky.addColorStop(0,'#07101d');sky.addColorStop(1,'#1b4160');rx.fillStyle=sky;rx.fillRect(0,0,800,400);const ground=rx.createLinearGradient(0,400,0,800);ground.addColorStop(0,'#173827');ground.addColorStop(1,'#08150e');rx.fillStyle=ground;rx.fillRect(0,400,800,400);rx.strokeStyle='rgba(93,202,165,.18)';for(let y=420;y<800;y+=55){rx.beginPath();rx.moveTo(0,y);rx.lineTo(800,y);rx.stroke()}const things=[...(rs.players||[]).filter(p=>p.id!==rs.you&&p.hp>0).map(p=>({...p,type:'player'})),...(rs.bullets||[]).map(b=>({...b,type:'bullet'}))].map(o=>{const dx=o.x-me.x,dy=o.y-me.y,dist=Math.hypot(dx,dy),rel=Math.atan2(dy,dx)-angle;return{...o,dist,rel:Math.atan2(Math.sin(rel),Math.cos(rel))}}).filter(o=>Math.abs(o.rel)<1.05&&o.dist>4).sort((a,b)=>b.dist-a.dist);for(const o of things){const scale=Math.min(3,260/o.dist),x=400+Math.tan(o.rel)*380,y=410+170/o.dist;if(o.type==='bullet'){rx.fillStyle='#ffd166';rx.beginPath();rx.arc(x,y,Math.max(3,7*scale),0,7);rx.fill()}else{const h=60*scale,w=34*scale;rx.fillStyle='#ff657a';rx.fillRect(x-w/2,y-h,w,h);rx.fillStyle='#fff';rx.font=`${Math.max(12,16*scale)}px sans-serif`;rx.textAlign='center';rx.fillText(o.name,x,y-h-8)}}rx.strokeStyle='#5dcaa5';rx.lineWidth=2;rx.beginPath();rx.moveTo(382,400);rx.lineTo(418,400);rx.moveTo(400,382);rx.lineTo(400,418);rx.stroke();rx.fillStyle='#edf3ff';rx.font='18px sans-serif';rx.textAlign='left';rx.fillText('WASD mover · ratón apuntar · clic disparar',20,35)}function rd(){rx.clearRect(0,0,800,800);rx.fillStyle='#0a1724';rx.fillRect(0,0,800,800);if(!rs){rx.fillStyle='#8d9bb2';rx.font='32px sans-serif';rx.textAlign='center';rx.fillText('Pulsa Entrar',400,400);return}if(rview==='first')firstDraw();else{rx.strokeStyle='rgba(93,202,165,.1)';for(let n=0;n<=800;n+=40){rx.beginPath();rx.moveTo(n,0);rx.lineTo(n,800);rx.stroke();rx.beginPath();rx.moveTo(0,n);rx.lineTo(800,n);rx.stroke()}rx.beginPath();rx.arc(400,400,rs.zone,0,Math.PI*2);rx.strokeStyle='#2aabee';rx.lineWidth=12;rx.stroke();for(const b of rs.bullets||[]){rx.beginPath();rx.arc(b.x,b.y,6,0,Math.PI*2);rx.fillStyle='#ffd166';rx.fill()}for(const p of rs.players||[]){rx.fillStyle=p.id===rs.you?'#5dcaa5':p.hp>0?'#ff657a':'#4b5563';rx.fillRect(p.x-14,p.y-14,28,28);rx.fillStyle='#fff';rx.font='18px sans-serif';rx.textAlign='center';rx.fillText(p.name,p.x,p.y-22);rx.fillStyle='#182033';rx.fillRect(p.x-18,p.y+19,36,5);rx.fillStyle='#5dcaa5';rx.fillRect(p.x-18,p.y+19,36*Math.max(0,p.hp)/100,5)}}const alive=(rs.players||[]).filter(p=>p.hp>0);$('#royaleAlive').textContent=`${alive.length} vivos · sala ${rs.room}`;const me=(rs.players||[]).find(p=>p.id===rs.you);if(rs.winner){const w=(rs.players||[]).find(p=>p.id===rs.winner);$('#royaleStatus').textContent=w?`🏆 Gana ${w.name}`:'Partida terminada'}else if(me)$('#royaleStatus').textContent=me.hp>0?`Vida ${Math.ceil(me.hp)} · Bajas ${me.kills}`:'Has sido eliminado'}async function join(){if(busy)return;busy=true;const ok=await ra('join');busy=false;if(ok&&!rt)rt=setInterval(()=>ra('state'),450)}$('#royaleJoin').onclick=join;function rmove(dx,dy){if(rview==='first'){const f=dy?-dy:0,s=dx||0;ra('move',{dx:Math.cos(angle)*f+Math.cos(angle+Math.PI/2)*s,dy:Math.sin(angle)*f+Math.sin(angle+Math.PI/2)*s})}else ra('move',{dx,dy})}document.querySelectorAll('[data-rmove]').forEach(b=>b.onclick=()=>{const[dx,dy]=b.dataset.rmove.split(',').map(Number);rmove(dx,dy)});rc.onpointermove=e=>{if(rview==='first'&&e.pointerType==='mouse'){const r=rc.getBoundingClientRect();angle=(e.clientX-r.left)/r.width*Math.PI*2-Math.PI}else if(rview==='top'){const r=rc.getBoundingClientRect(),x=(e.clientX-r.left)*800/r.width,y=(e.clientY-r.top)*800/r.height,me=rs?.players?.find(p=>p.id===rs.you);if(me)angle=Math.atan2(y-me.y,x-me.x)}rd()};rc.onclick=()=>{if(rview==='first')ra('shoot',{angle})};$('#royaleShoot').onclick=()=>ra('shoot',{angle});function view(v){rview=v;$('#royaleTop').classList.toggle('on',v==='top');$('#royaleFirst').classList.toggle('on',v==='first');rd()}$('#royaleTop').onclick=()=>view('top');$('#royaleFirst').onclick=()=>view('first');$('#royaleFull').onclick=async()=>{const el=$('#royale');try{if(!document.fullscreenElement)await el.requestFullscreen();else await document.exitFullscreen()}catch(e){el.classList.toggle('stage-full')}};document.addEventListener('fullscreenchange',()=>$('#royale').classList.toggle('stage-full',!!document.fullscreenElement));addEventListener('keydown',e=>{if(!$('#royale').classList.contains('on')||e.repeat)return;const m={w:[0,-1],arrowup:[0,-1],s:[0,1],arrowdown:[0,1],a:[-1,0],arrowleft:[-1,0],d:[1,0],arrowright:[1,0]}[e.key.toLowerCase()];if(m){e.preventDefault();rmove(...m)}if(e.code==='Space'){e.preventDefault();ra('shoot',{angle})}});rd();
</script></body></html>
