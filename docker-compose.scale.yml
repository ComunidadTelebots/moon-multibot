services:
  moonbot:
    container_name: !reset null
    environment:
      MOON_ROLE: web
      AUTO_DOCKER_UPDATE: "false"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.moonbot.rule=Host(`cintiabot.todosobreall.tech`)"
      - "traefik.http.routers.moonbot.entrypoints=websecure"
      - "traefik.http.routers.moonbot.tls=true"
      - "traefik.http.routers.moonbot.tls.certresolver=letsencrypt"
      - "traefik.http.services.moonbot.loadbalancer.server.port=5000"
      - "traefik.http.services.moonbot.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.moonbot.loadbalancer.healthcheck.interval=10s"

  moonbot-worker:
    build: .
    restart: unless-stopped
    env_file: [.env]
    environment:
      MOON_ENV: prod
      MOON_ROLE: worker
      AUTO_DOCKER_UPDATE: "false"
    volumes:
      - .:/app
      - ./data:/app/data
      - ./downloads:/app/downloads
    networks: [traefik]
    labels:
      - "traefik.enable=false"
