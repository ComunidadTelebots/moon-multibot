name: Build TDLib base image

on:
  push:
    branches: [master]
    paths:
      - Dockerfile.tdlib
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push TDLib base image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.tdlib
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/moon-multibot-tdlib:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
