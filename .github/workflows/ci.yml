name: CI

on:
  push:
    branches: [master, alpha, dev]
    paths:
      - "**.py"
      - "web/hub.html"
      - "web/script.js"
      - "tests/**.cjs"
      - "requirements.txt"
      - "Dockerfile"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [master, alpha, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install validation tools
        run: pip install ruff requests flask PyJWT python-dotenv paramiko

      # Prioriza errores que pueden romper la ejecución. El estilo histórico se
      # corregirá por lotes sin convertir deuda antigua en falsos negativos.
      - name: Check fatal Python errors
        run: >-
          ruff check
          moon_multibot.py core plugins
          ban_manager.py community_engagement.py community_members.py
          gban_intelligence.py group_administration.py group_rss.py group_suite.py
          roadmap_engine.py spam_analyzer.py spam_risk.py universal_i18n.py
          --select E9,F63,F7,F82 --no-cache

      - name: Run unit tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -v

      - name: Test dashboard polling
        run: node --test tests/dashboard_polling.test.cjs

      - name: Extract Hub JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', Path('web/hub.html').read_text(encoding='utf-8-sig'), re.S)
          Path('/tmp/hub-inline.js').write_text(scripts[-1], encoding='utf-8')
          PY

      - name: Validate Hub JavaScript
        run: node --check /tmp/hub-inline.js

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build Python 3.14 image without publishing
        run: docker buildx build --load --tag moonbot-ci:local .
      - name: Verify Python dependencies and TDLib shared library
        run: >-
          docker run --rm --entrypoint python moonbot-ci:local -c
          'import ctypes, requests, flask, telethon, sklearn, cryptography;
          ctypes.CDLL("/usr/local/lib/libtdjson.so");
          from core.cdn_discovery import CdnDiscovery;
          print("Python dependencies and TDLib loaded")'
