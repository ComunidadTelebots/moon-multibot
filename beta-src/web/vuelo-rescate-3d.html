<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Vuelo Rescate 3D</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        overflow: hidden;
        background: #8ad3ef;
        color: #fff;
        font: 14px system-ui;
      }
      canvas {
        display: block;
      }
      .hud,
      .bar {
        position: fixed;
        z-index: 2;
        display: flex;
        gap: 7px;
      }
      .hud {
        inset: 10px 10px auto;
      }
      .bar {
        left: 10px;
        bottom: 10px;
      }
      .right {
        left: auto;
        right: 10px;
      }
      .pill,
      button {
        padding: 9px 12px;
        border: 1px solid #b9efff;
        border-radius: 11px;
        background: #08243cce;
        color: #fff;
      }
      .pill b {
        color: #6fffe7;
      }
      button {
        font-weight: 700;
      }
      .mobile {
        display: none;
      }
      @media (max-width: 700px) {
        .mobile {
          display: block;
        }
        .pill,
        button {
          padding: 8px;
          font-size: 12px;
        }
      }
    </style>
  </head>
  <body>
    <div class="hud">
      <div class="pill">Rescates <b id="score">0</b></div>
      <div class="pill">Altitud <b id="alt">30 m</b></div>
      <div class="pill">Vista <b id="view">Exterior</b></div>
      <div class="pill">Velocidad <b id="airspeed">65 km/h</b></div>
      <div class="pill">Vertical <b id="vertical">0 m/s</b></div>
      <div class="pill">Combustible <b id="fuel">100%</b></div>
      <div class="pill">Viento <b id="wind">0 kt</b></div>
    </div>
    <div class="bar">
      <button id="cam">Vista</button><button id="mode2d">Versión 2D</button
      ><button id="convoy">Mundo compartido</button><button id="liveWeather">Clima real</button><button id="full">⛶</button>
    </div>
    <div class="bar right">
      <button class="mobile" data-k="a">◀</button
      ><button data-k="s">Bajar</button><button data-k="w">Subir</button
      ><button class="mobile" data-k="d">▶</button>
    </div>
    <script src="/games-convoy.js"></script><script src="/games-shared-world.js"></script><script src="/games-shared-operations.js"></script><script type="module">
      import * as T from "./vendor/three.module.min.js";
      import { createRotorcraftDynamics } from "./flight-dynamics.js";
      import { createLiveEnvironment } from "./transport-live-environment.js";
      const graphicsParams = new URLSearchParams(location.search),
        graphicsMode = graphicsParams.get("graphics") || "auto",
        graphicsQuality = graphicsParams.get("quality") || "high",
        qualityLevel = { low: 0, medium: 1, high: 2, ultra: 3 }[graphicsQuality] ?? 2,
        pixelRatio = [0.75, 1.15, 1.75, 2.4][qualityLevel],
        shadows = graphicsMode !== "compat" && qualityLevel > 0;
      const S = new T.Scene();
      const sharedWorldPresence = window.MoonSharedWorld.createThreePresence({ THREE: T, scene: S });
      const sharedOperations = window.MoonSharedOperations.create();
      const liveEnvironment = createLiveEnvironment(); let liveWeatherState = null;
      S.background = new T.Color(0x8ad3ef);
      S.fog = new T.Fog(0x9edcf0, 100, 520);
      const C = new T.PerspectiveCamera(66, innerWidth / innerHeight, 0.1, 800),
        R = new T.WebGLRenderer({ antialias: qualityLevel > 0, powerPreference: graphicsMode === "gpu" ? "high-performance" : "default" });
      R.setPixelRatio(Math.min(devicePixelRatio, pixelRatio));
      R.setSize(innerWidth, innerHeight);
      R.shadowMap.enabled = shadows;
      R.shadowMap.type = T.PCFSoftShadowMap;
      R.outputColorSpace = T.SRGBColorSpace;
      R.toneMapping = T.ACESFilmicToneMapping;
      R.toneMappingExposure = qualityLevel >= 2 ? 1.12 : 1;
      document.body.prepend(R.domElement);
      S.add(new T.HemisphereLight(0xffffff, 0x34592e, 2.2));
      const sun = new T.DirectionalLight(0xffefd0, 3);
      sun.position.set(-80, 130, 30);
      sun.castShadow = shadows;
      sun.shadow.mapSize.set(qualityLevel === 3 ? 4096 : qualityLevel === 2 ? 2048 : 1024, qualityLevel === 3 ? 4096 : qualityLevel === 2 ? 2048 : 1024);
      S.add(sun);
      document.querySelector(".hud").insertAdjacentHTML("beforeend", `<div class="pill">Gráficos <b>${graphicsQuality.toUpperCase()} · ${shadows ? "GPU" : "2D"}</b></div>`);
      const m = (c) =>
          new T.MeshStandardMaterial({ color: c, roughness: 0.65 }),
        box = (w, h, d, c) => {
          const x = new T.Mesh(new T.BoxGeometry(w, h, d), m(c));
          x.castShadow = x.receiveShadow = true;
          return x;
        };
      let land = box(600, 3, 1000, 0x397847);
      land.position.y = -2;
      S.add(land);
      for (let i = 0; i < [28, 50, 85, 130][qualityLevel]; i++) {
        const h = 8 + Math.random() * 45,
          b = box(
            7 + Math.random() * 8,
            h,
            7 + Math.random() * 10,
            [0xd5c09a, 0xb8c7d3, 0xd38c72][i % 3],
          );
        b.position.set(
          (Math.random() - 0.5) * 230,
          h / 2 - 1,
          -Math.random() * 850 + 100,
        );
        S.add(b);
      }
      for (let i = 0; i < [18, 32, 60, 95][qualityLevel]; i++) {
        const cone = new T.Mesh(
          new T.ConeGeometry(5 + Math.random() * 8, 16 + Math.random() * 25, 7),
          m(0x416a43),
        );
        cone.position.set(
          (Math.random() - 0.5) * 320,
          8,
          -Math.random() * 900 + 100,
        );
        S.add(cone);
      }
      const heli = new T.Group();
      let b = box(4, 2.4, 6, 0xf5b82e);
      b.position.y = 1;
      heli.add(b);
      const nose = new T.Mesh(
        new T.SphereGeometry(2, 20, 14),
        new T.MeshPhysicalMaterial({
          color: 0x24566b,
          transparent: true,
          opacity: 0.8,
          roughness: 0.1,
        }),
      );
      nose.scale.set(1, 0.75, 1.3);
      nose.position.set(0, 1, -2.8);
      heli.add(nose);
      b = box(0.55, 0.55, 7, 0xe09a20);
      b.position.set(0, 1, 6);
      heli.add(b);
      b = box(11, 0.16, 0.5, 0x20252b);
      b.position.set(0, 3, 0);
      heli.add(b);
      const rotor = b;
      b = box(0.15, 3.8, 0.4, 0x20252b);
      b.position.set(0, 1, 9.5);
      heli.add(b);
      for (const x of [-1.5, 1.5]) {
        b = box(0.18, 0.18, 5, 0x252a2f);
        b.position.set(x, -0.4, 0.4);
        heli.add(b);
      }
      heli.position.set(0, 30, 50);
      S.add(heli);
      const targets = [];
      for (let i = 0; i < 8; i++) {
        const t = new T.Mesh(
          new T.TorusGeometry(3, 0.45, 10, 25),
          new T.MeshStandardMaterial({
            color: 0x35ffe1,
            emissive: 0x35ffe1,
            emissiveIntensity: 3,
          }),
        );
        t.rotation.x = Math.PI / 2;
        t.position.set((Math.random() - 0.5) * 150, 4, -80 - i * 100);
        S.add(t);
        targets.push(t);
      }
      let keys = {},
        score = 0,
        view = 0,
        speed = 25;
      const dynamics = createRotorcraftDynamics();
      let previousFrame = performance.now();
      document.querySelectorAll("[data-k]").forEach((q) => {
        const k = q.dataset.k;
        q.onpointerdown = () => (keys[k] = 1);
        ["pointerup", "pointerleave", "pointercancel"].forEach((e) =>
          q.addEventListener(e, () => (keys[k] = 0)),
        );
      });
      onkeydown = (e) => (keys[e.key.toLowerCase()] = 1);
      onkeyup = (e) => (keys[e.key.toLowerCase()] = 0);
      cam.onclick = () => {
        view = 1 - view;
        document.querySelector("#view").textContent = view
          ? "Cabina"
          : "Exterior";
      };
      convoy.onclick = () => window.MoonConvoy.join(prompt("Código del mundo compartido (vacío para crear)") || "");
      liveWeather.onclick = async () => { if(liveWeatherState){liveEnvironment.disable();liveWeatherState=null;liveWeather.textContent="Clima real";return} liveWeather.textContent="Cargando…";liveEnvironment.setLocation({lat:40.4168,lon:-3.7038});liveWeatherState=await liveEnvironment.load(true);liveWeather.textContent=`${liveWeatherState.weather} · ${Math.round(liveWeatherState.temperature||0)}°C`;S.fog.near=liveWeatherState.weather==="fog"?25:100;S.fog.far=liveWeatherState.weather==="fog"?180:liveWeatherState.weather==="rain"?350:520; };
      window.MoonConvoy.onChange(state => { sharedWorldPresence.update(state, state.you); const operation=sharedOperations.get(state); convoy.textContent = state.joined ? `${state.room} · ${state.players.length + state.ai.length} vehículos · ${state.mode === "online" ? `${state.ping} ms` : "LAN"}` : "Mundo compartido"; convoy.title=operation?`${operation.name} · ${operation.ready}/${operation.roles.length} medios · ${operation.remaining}s`:""; });
      mode2d.onclick = () => {
        try {
          parent.document.querySelector('[data-game="flight2d"]').click();
        } catch (e) {
          location.href = "/hub-games.html?game=flight2d";
        }
      };
      full.onclick = () =>
        document.fullscreenElement
          ? document.exitFullscreen()
          : document.documentElement.requestFullscreen();
      function loop(now = performance.now()) {
        const dt = Math.min(.05, (now - previousFrame) / 1000); previousFrame = now;
        const frame = dynamics.update({ up: keys.w, down: keys.s, left: keys.a, right: keys.d, time: now, windSpeed: liveWeatherState?.windSpeed }, dt);
        heli.position.x = T.MathUtils.clamp(heli.position.x + frame.velocity.x * dt, -95, 95);
        heli.position.y = T.MathUtils.clamp(heli.position.y + frame.velocity.y * dt, 1.4, 85);
        heli.position.z += frame.velocity.z * dt;
        heli.rotation.z += ((keys.a ? -.13 : keys.d ? .13 : 0) - heli.rotation.z) * Math.min(1, dt * 3.4);
        heli.rotation.x += ((frame.verticalSpeed * -.012) - heli.rotation.x) * Math.min(1, dt * 2.5);
        rotor.rotation.y += (.22 + frame.collective * .32) * dt * 60;
        for (const t of targets) {
          if (t.position.distanceTo(heli.position) < 7) {
            score++;
            scoreEl.textContent = score;
            t.position.z = heli.position.z - 700 - Math.random() * 250;
            t.position.x = (Math.random() - 0.5) * 150;
          }
          if (t.position.z > heli.position.z + 50)
            t.position.z = heli.position.z - 750;
        }
        if (view) {
          C.position.set(
            heli.position.x,
            heli.position.y + 1,
            heli.position.z - 2,
          );
          C.lookAt(heli.position.x, heli.position.y, heli.position.z - 40);
        } else {
          C.position.lerp(
            new T.Vector3(
              heli.position.x + 12,
              heli.position.y + 8,
              heli.position.z + 18,
            ),
            0.12,
          );
          C.lookAt(heli.position);
        }
        document.querySelector("#alt").textContent =
          Math.round(heli.position.y) + " m";
        document.querySelector("#airspeed").textContent = `${Math.round(frame.airspeed)} km/h`;
        document.querySelector("#vertical").textContent = `${frame.verticalSpeed >= 0 ? "+" : ""}${frame.verticalSpeed.toFixed(1)} m/s`;
        document.querySelector("#fuel").textContent = `${Math.round(frame.fuel)}%`;
        document.querySelector("#wind").textContent = `${Math.round(Math.abs(frame.wind) * 1.944)} kt`;
        window.MoonConvoy.update({ game: "air", vehicle: "helicopter", x: heli.position.x, y: heli.position.z, z: heli.position.z, altitude: heli.position.y, speed: frame.airspeed, heading: heli.rotation.y, cargo: `Rescates ${score}`, engine:frame.fuel>0, headlights:false, braking:false, indicator:0, hazards:false, siren:false, weather:liveWeatherState?.weather||"clear" });
        sharedWorldPresence.tick(dt);
        const operation = sharedOperations.get(window.MoonConvoy.state, Date.now()); if (operation && window.MoonConvoy.state.joined) document.querySelector("#view").title = operation.complete ? `${operation.name} completada` : `${operation.name}: ${operation.ready}/${operation.roles.length} medios en destino`;
        R.render(S, C);
        requestAnimationFrame(loop);
      }
      const scoreEl = document.querySelector("#score");
      onresize = () => {
        C.aspect = innerWidth / innerHeight;
        C.updateProjectionMatrix();
        R.setSize(innerWidth, innerHeight);
      };
      loop();
    </script>
    <script>
      var cam = document.querySelector("#cam"),
        convoy = document.querySelector("#convoy"),
        liveWeather = document.querySelector("#liveWeather"),
        mode2d = document.querySelector("#mode2d"),
        full = document.querySelector("#full");
    </script>
  </body>
</html>
